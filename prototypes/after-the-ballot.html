<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>אחרי הקלפי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: a single night-sky news screen per scene. A white title plate on a gold rule, one big graphic
   (seats, the tally, the road to 61, the plenum), then one decision of 2-4 white option plates, each with
   its chance and what it gives on success and on failure. Tokens follow the approved negotiation demo (D-0026). */
:root {
  --night-0: #040a1c; --night-1: #0a1a3f; --night-2: #14306c; --navy-tab: #1d3a80;
  --panel: rgba(10, 26, 63, 0.84); --panel-line: rgba(217, 180, 90, 0.42);
  --paper: #ffffff; --paper-2: #e9ecf3; --paper-line: #c5cbd9; --navy: #0c1f4d; --navy-muted: #44506f;
  --text: #ffffff; --muted: #b7c3e0;
  --gold: #d9b45a; --gold-hi: #f6e19a; --gold-lo: #8f6a26;
  --gold-grad: linear-gradient(180deg, #f6e19a, #d9b45a 45%, #8f6a26);
  --gold-line: linear-gradient(90deg, #8f6a26, #d9b45a 28%, #f6e19a 58%, #d9b45a 84%, #8f6a26);
  --studio: #c8102e;
  --good: #3ddc97; --bad: #ff7a70; --abst: #9aa7c8;
  --good-ink: #0f7a4a; --bad-ink: #b3261e; --warn-ink: #8a5200;
  --f: 'Heebo', 'Arial Hebrew', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; background: var(--night-0); }
body { color: var(--text); font-family: var(--f); font-size: 15px; line-height: 1.45; direction: rtl; }
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.55), transparent 60%), radial-gradient(1.5px 1.5px at 78% 9%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 44% 26%, rgba(255,255,255,.35), transparent 60%), radial-gradient(2px 2px at 91% 33%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1.2px 1.2px at 30% 8%, rgba(255,255,255,.4), transparent 60%), radial-gradient(1.2px 1.2px at 62% 15%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(120% 60% at 50% 110%, rgba(64, 110, 210, 0.45), transparent 60%),
    linear-gradient(180deg, var(--night-0), var(--night-1) 55%, var(--night-2)); }
.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 0; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; overflow-x: clip; }
.app * { box-sizing: border-box; }
.app h1, .app h2, .app h3, .app p, .app ul, .app ol { margin: 0; padding: 0; }
.app ul, .app ol { list-style: none; }
:where(.app) button { font: inherit; color: inherit; cursor: pointer; }
.app button:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
.app img { display: block; }

/* top strip: brand, scene dots, restart, and who you are */
.top { display: grid; gap: 10px; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; }
.brand { font-weight: 900; font-size: 22px; letter-spacing: .01em; text-shadow: 0 2px 18px rgba(80, 140, 255, 0.35); }
.dots { display: flex; gap: 7px; align-items: center; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(246, 225, 154, .55); background: transparent; transition: background .3s, transform .3s; }
.dots i.done { background: rgba(246, 225, 154, .45); }
.dots i.cur { background: var(--gold-hi); border-color: var(--gold-hi); transform: scale(1.25); box-shadow: 0 0 10px rgba(246, 225, 154, .8); }
.me { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.me b { color: var(--text); font-weight: 800; }

/* scene head: time beat, white plate, gold rule */
.scene { display: grid; gap: 16px; min-width: 0; animation: enter .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes enter { from { opacity: 0; transform: translateX(-40px); } }
.head { display: grid; gap: 10px; justify-items: start; }
.beat { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--gold-hi); }
.beat::before { content: ''; width: 18px; height: 3px; background: var(--gold-grad); }
.plate { position: relative; overflow: hidden; display: inline-block; background: var(--paper); color: #000; font-weight: 900; font-size: clamp(24px, 6vw, 34px); line-height: 1.15; padding: 4px 18px 6px; box-shadow: 0 8px 22px rgba(0,0,0,.45); animation: plate .55s cubic-bezier(.2,.8,.2,1) both; }
.plate::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(246, 225, 154, 0.75) 48%, transparent 66%); transform: translateX(120%); animation: shine 2.4s .4s ease-in-out both; }
@keyframes plate { from { clip-path: inset(0 50%); } to { clip-path: inset(0 0); } }
@keyframes shine { to { transform: translateX(-120%); } }
.rule { width: 100%; height: 3px; background: var(--gold-grad); box-shadow: 0 0 14px rgba(246, 225, 154, 0.55); transform-origin: right; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { transform: scaleX(0); } }
.lead { color: var(--muted); font-size: 15.5px; max-width: 68ch; }

/* panels */
.card { position: relative; background: var(--panel); border: 1px solid var(--panel-line); border-top: 3px solid var(--gold); padding: 14px; display: grid; gap: 12px; min-width: 0; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35); }
.card > h2, .q { font-weight: 800; font-size: 20px; line-height: 1.25; }
.card h3 { font-weight: 800; font-size: 16px; }
.note { font-size: 13.5px; color: var(--muted); }

/* photos and logos */
.ph { position: relative; flex: none; width: 64px; height: 64px; overflow: hidden; background: linear-gradient(180deg, #23458f, #0a1a3f); border-bottom: 4px solid var(--gold); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph.sm { width: 40px; height: 40px; border-bottom-width: 3px; }
.ph.lg { width: 84px; height: 84px; }
.logo { display: inline-grid; place-items: center; flex: none; height: 26px; width: calc(26px * var(--r, 1)); max-width: 92px; padding: 2px 4px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.logo.big { height: 48px; width: calc(48px * var(--r, 1)); max-width: 96px; padding: 4px 6px; }
.logo.sm { height: 20px; width: calc(20px * var(--r, 1)); max-width: 70px; padding: 1px 3px; }

/* scene 1: seats by bloc */
.blocs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 860px) { .blocs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.bloc { position: relative; display: grid; align-content: start; gap: 6px; padding: 10px 12px 12px; background: rgba(255,255,255,.06); border-top: 4px solid var(--bc); min-width: 0; animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 90ms); }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.bloc.is-me { background: rgba(246, 225, 154, .12); box-shadow: inset 0 0 0 2px var(--gold-hi); }
.bloc small { font-weight: 700; font-size: 13.5px; color: var(--muted); }
.bloc .big { font-weight: 900; font-size: clamp(46px, 13vw, 64px); line-height: .95; letter-spacing: -.02em; }
.bloc .tag-me { position: absolute; top: 8px; inset-inline-end: 8px; font-size: 11.5px; font-weight: 900; background: var(--gold-grad); color: var(--navy); padding: 2px 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.pchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 800; background: rgba(4,10,28,.5); padding: 2px 6px 2px 2px; }
.bar120 { position: relative; display: flex; height: 28px; border: 2px solid var(--gold); background: rgba(255,255,255,.08); margin-top: 20px; }
.bar120 span { height: 100%; box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), inset -1px 0 0 rgba(4,10,28,.7); animation: growW .9s cubic-bezier(.2,.8,.2,1) both; transform-origin: right; }
.bar120 span.me { outline: 2px solid var(--gold-hi); outline-offset: -2px; }
.bar120 span.pend { opacity: .9; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.6) 0 4px, transparent 4px 9px); }
.bar120 span.you { background: transparent !important; outline: 3px dashed var(--gold-hi); outline-offset: -3px; animation: breathe 1.2s ease-in-out infinite alternate; }
@keyframes breathe { to { opacity: .55; } }
@keyframes growW { from { transform: scaleX(0); } }
.m61 { position: absolute; top: -9px; bottom: -9px; inset-inline-start: calc(61 / 120 * 100%); border-inline-start: 3px solid var(--gold-hi); box-shadow: 0 0 10px var(--gold-hi); }
.m61::before { content: '61'; position: absolute; top: -21px; inset-inline-start: -10px; font-weight: 900; font-size: 14px; color: var(--gold-hi); }
.barline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.barline b { color: var(--text); font-weight: 900; font-size: 22px; }

/* rival moves: each with its reason */
.moves { display: grid; gap: 8px; }
@media (min-width: 860px) { .moves.two { grid-template-columns: 1fr 1fr; } }
.move { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; padding: 9px 10px; background: rgba(255,255,255,.06); border-inline-start: 4px solid var(--gold); animation: sweep .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 110ms); }
@keyframes sweep { from { transform: translateX(-50px); opacity: 0; } }
.move .logo, .move .ph { grid-row: span 2; }
.move b { font-weight: 800; font-size: 14.5px; line-height: 1.35; }
.move small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.move small::before { content: 'למה: '; font-weight: 800; color: var(--gold-hi); }

/* calls */
.calls { display: grid; gap: 12px; }
@media (min-width: 860px) { .calls { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.call { display: grid; gap: 8px; align-content: start; background: var(--paper); color: var(--navy); padding: 12px; border-bottom: 5px solid var(--gold); box-shadow: 0 10px 26px rgba(0,0,0,.42); min-width: 0; animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 120ms + 200ms); }
.call-h { display: flex; gap: 10px; align-items: center; }
.call-h .who { display: grid; gap: 1px; min-width: 0; }
.call-h b { font-weight: 900; font-size: 18px; line-height: 1.15; }
.call-h small { color: var(--navy-muted); font-size: 13px; }
.ring { display: inline-flex; align-items: center; gap: 6px; justify-self: start; background: var(--studio); color: #fff; font-weight: 900; font-size: 12px; padding: 2px 8px; }
.ring::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
.kv { display: grid; gap: 4px; font-size: 14px; line-height: 1.4; }
.kv div { display: grid; grid-template-columns: 52px 1fr; gap: 8px; }
.kv dt, .kv .k { font-weight: 900; color: var(--navy-muted); font-size: 12.5px; padding-top: 2px; }
.quote { font-weight: 700; font-size: 15px; line-height: 1.4; padding: 6px 10px; background: var(--paper-2); border-inline-start: 4px solid var(--navy); }
.warn { font-size: 13.5px; line-height: 1.45; padding: 8px 10px; background: #fde8e6; color: var(--bad-ink); border-inline-start: 4px solid var(--bad-ink); }
.warn b { font-weight: 900; }

/* options: white plates with chance and outcomes */
.opts { display: grid; gap: 16px; padding-top: 6px; }
@media (min-width: 860px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.opt { position: relative; width: 100%; display: grid; gap: 4px; align-content: start; text-align: start; padding: 20px 14px 12px; background: var(--paper); color: var(--navy); border: 0; border-bottom: 5px solid var(--gold); box-shadow: 0 10px 26px rgba(0,0,0,.42); transition: transform .2s, box-shadow .2s, opacity .3s; animation: sweep .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 100ms); min-width: 0; }
.opt:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,.5), 0 0 0 2px var(--gold-hi); }
.opt:disabled { cursor: default; }
.opt.is-off { opacity: .42; }
.opt.is-on { box-shadow: 0 0 0 3px var(--gold-hi), 0 12px 28px rgba(0,0,0,.5); }
.cat { position: absolute; top: -12px; inset-inline-start: 12px; background: linear-gradient(180deg, var(--navy-tab), var(--night-1)); color: #fff; font-weight: 800; font-size: 12.5px; line-height: 1; padding: 6px 10px; border-top: 2px solid var(--gold); box-shadow: 0 4px 12px rgba(0,0,0,.4); }
.cat.risk { border-top-color: var(--gold-hi); }
.cat.break { background: var(--studio); border-top-color: #fff; }
.opt-t { font-weight: 900; font-size: 19px; line-height: 1.2; }
.opt-s { color: var(--navy-muted); font-size: 13.5px; line-height: 1.4; }
.odds { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; margin-top: 6px; padding-top: 8px; border-top: 1px solid #d3d9e6; }
.chance { display: grid; gap: 4px; min-width: 76px; }
.chance b { font-weight: 900; font-size: 36px; line-height: .95; letter-spacing: -.02em; }
.chance small { font-weight: 700; font-size: 11.5px; color: var(--navy-muted); }
.meter { display: block; height: 6px; background: #dde2ee; overflow: hidden; }
.meter i { display: block; height: 100%; width: calc(var(--c) * 100%); background: linear-gradient(90deg, #8f6a26, #d9b45a 40%, #f6e19a); animation: growW .9s cubic-bezier(.2,.8,.2,1) both; transform-origin: right; }
.vals { display: grid; gap: 4px; font-size: 13.5px; line-height: 1.4; min-width: 0; }
.vals span { display: block; padding-inline-start: 18px; position: relative; }
.vals span::before { position: absolute; inset-inline-start: 0; top: 0; font-weight: 900; }
.v-win::before { content: '✓'; color: var(--good-ink); }
.v-lose::before { content: '✗'; color: var(--bad-ink); }
.vals em { font-style: normal; font-weight: 800; }
.chip { justify-self: start; display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12.5px; font-weight: 900; padding: 3px 9px; background: #1d1a00; color: var(--gold-hi); border: 1px solid var(--gold); }
.chip::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--gold-grad); box-shadow: 0 0 6px rgba(246,225,154,.8); }
.opt-note { font-size: 12.5px; font-weight: 700; color: var(--navy-muted); }

/* the result of a move: a news flash */
.flash { display: grid; gap: 10px; padding: 0 0 14px; background: var(--paper); color: var(--navy); box-shadow: 0 12px 30px rgba(0,0,0,.5); animation: wipe .5s cubic-bezier(.2,.8,.2,1) both; scroll-margin-top: 12px; }
@keyframes wipe { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
.flash-band { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; color: #fff; background: linear-gradient(90deg, var(--night-2), var(--night-1)); border-inline-start: 6px solid var(--gold); }
.flash.bad .flash-band { border-inline-start-color: var(--studio); }
.flash.good .flash-band { border-inline-start-color: var(--good); }
.flash-band b { font-weight: 900; font-size: 19px; line-height: 1.25; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; background: var(--studio); color: #fff; font-weight: 900; font-size: 13px; }
.tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.3s ease-in-out infinite; }
.flash > p, .flash > .items, .flash > .go, .flash > .kv { margin-inline: 14px; }
.say { font-weight: 700; font-size: 17px; line-height: 1.4; }
.why { font-size: 14.5px; line-height: 1.5; padding: 8px 10px; background: var(--paper-2); }
.why b { display: block; font-size: 12.5px; color: var(--navy-muted); }
.go { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { min-height: 48px; padding: 8px 20px; border: 2px solid rgba(255,255,255,.75); background: transparent; color: var(--text); font-weight: 800; font-size: 15.5px; }
.btn-primary { position: relative; overflow: hidden; background: var(--gold-grad); color: var(--navy); border-color: var(--gold-hi); box-shadow: 0 0 18px rgba(246, 225, 154, 0.35); }
.btn-sm { min-height: 44px; padding: 6px 14px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.flash .btn:not(.btn-primary) { color: var(--navy); border-color: var(--navy); }
.items { display: grid; gap: 6px; }
.items li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; font-size: 14.5px; font-weight: 700; padding: 6px 10px; background: var(--paper-2); color: var(--navy); border-inline-start: 4px solid var(--gold); }
.items li.soft { border-inline-start-style: dashed; }
.items li small { font-weight: 600; color: var(--navy-muted); font-size: 12.5px; }

/* scene 2: the offers and the tally */
.offers { display: grid; gap: 10px; }
@media (min-width: 860px) { .offers { grid-template-columns: 1fr 1fr; } }
.offer { display: flex; gap: 12px; align-items: flex-start; background: var(--paper); color: var(--navy); padding: 10px 12px; border-bottom: 4px solid var(--gold); min-width: 0; }
.offer-b { display: grid; gap: 4px; justify-items: start; min-width: 0; }
.offer-b > span:not(.tier) { font-weight: 700; font-size: 15px; line-height: 1.35; }
.offer b { font-weight: 900; font-size: 16.5px; }
.offer .tier { justify-self: start; font-size: 12px; font-weight: 900; padding: 2px 8px; background: var(--navy); color: #fff; }
.offer .tier.sen { background: var(--studio); }
.offer .tier.cl { background: var(--good-ink); }
.offer small { color: var(--navy-muted); font-size: 13px; line-height: 1.4; }
.race { display: grid; gap: 10px; }
.rrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.rrow .nm { font-weight: 800; font-size: 14.5px; min-width: 0; }
.rbar { position: relative; height: 22px; background: rgba(255,255,255,.08); border: 2px solid rgba(217,180,90,.7); }
.rbar i { position: absolute; inset-block: 0; inset-inline-start: 0; width: calc(var(--n) / 120 * 100%); background: var(--rc); transition: width .35s cubic-bezier(.2,.8,.2,1); }
.rbar .m61 { top: -5px; bottom: -5px; }
.rbar .m61::before { display: none; }
.rnum { font-weight: 900; font-size: 30px; line-height: 1; min-width: 2ch; text-align: end; }
.reclist { display: grid; gap: 6px; }
@media (min-width: 860px) { .reclist { grid-template-columns: 1fr 1fr; } }
.rec { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 7px 10px; background: rgba(255,255,255,.06); border-inline-start: 4px solid var(--rc); animation: sweep .4s cubic-bezier(.2,.8,.2,1) both; }
.rec b { font-weight: 800; font-size: 14px; }
.rec small { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.rec .to { font-weight: 900; font-size: 13px; padding: 2px 8px; background: var(--rc); color: #fff; white-space: nowrap; }
.rec.is-me { background: rgba(246, 225, 154, .12); }
.verdict { font-weight: 800; font-size: 17px; line-height: 1.45; padding: 10px 12px; background: rgba(246, 225, 154, .12); border-inline-start: 5px solid var(--gold-hi); }

/* scene 3: Eisenkot's road and the asks */
.talk { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: start; background: var(--paper); color: var(--navy); padding: 12px; border-bottom: 5px solid var(--gold); }
.talk .ph { grid-row: span 2; }
.talk .say { font-size: 17px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; display: inline-block; }
.legend .l-in { background: linear-gradient(90deg, #1e56d6 50%, #c8202e 50%); }
.legend .l-pend { background: repeating-linear-gradient(45deg, rgba(255,255,255,.75) 0 3px, #2b5fb0 3px 6px); }
.legend .l-you { outline: 2px dashed var(--gold-hi); outline-offset: -2px; }
.whyyou { display: grid; gap: 6px; font-size: 14.5px; line-height: 1.5; }
.whyyou p { padding-inline-start: 12px; border-inline-start: 3px solid var(--gold); }
.whyyou b { font-weight: 800; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 148px), 1fr)); gap: 8px; }
@media (min-width: 860px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); } }
.tile { display: grid; gap: 3px; align-content: start; justify-items: start; text-align: start; min-height: 64px; padding: 9px 10px; min-width: 0; background: var(--paper); color: var(--navy); border: 0; border-bottom: 4px solid var(--gold); transition: transform .2s, box-shadow .2s; }
.tile b { font-weight: 800; font-size: 14.5px; line-height: 1.3; }
.tile small { color: var(--navy-muted); font-size: 12.5px; line-height: 1.35; }
.tile .kind { justify-self: start; font-size: 11.5px; font-weight: 900; padding: 1px 7px; background: var(--paper-2); }
.tile[aria-pressed="true"] { background: #fff7dc; box-shadow: 0 0 0 3px var(--gold-hi), 0 8px 18px rgba(0,0,0,.35); transform: translateY(-2px); }
.tile[aria-pressed="true"] .kind { background: var(--gold-grad); }
.tile:disabled { opacity: .5; cursor: not-allowed; }
.picked { font-size: 13.5px; color: var(--muted); }
.picked b { color: var(--gold-hi); }

/* scene 5: the plenum */
.plenum { display: grid; gap: 10px; justify-items: center; }
.hemi { width: 100%; max-width: 560px; height: auto; display: block; }
.hemi circle { fill: rgba(255,255,255,.08); stroke: rgba(183,195,224,.45); stroke-width: 1; transition: fill .25s, stroke .25s; }
.hemi circle.for { fill: var(--good); stroke: #fff; }
.hemi circle.against { fill: var(--bad); stroke: #fff; }
.hemi circle.abstain { fill: var(--abst); stroke: #fff; }
.hemi circle.wait { fill: var(--gold-hi); stroke: #fff; animation: blink .7s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.hemi text { fill: var(--gold-hi); font-family: var(--f); font-weight: 900; font-size: 15px; }
.count { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 560px; }
.count div { display: grid; justify-items: center; gap: 0; padding: 6px 4px; background: rgba(255,255,255,.06); border-top: 4px solid var(--cc); }
.count small { font-weight: 800; font-size: 13px; color: var(--muted); }
.count b { font-weight: 900; font-size: clamp(40px, 12vw, 60px); line-height: 1; letter-spacing: -.02em; }
.now { min-height: 1.5em; font-size: 14px; color: var(--muted); text-align: center; }
.now b { color: var(--text); }

/* scene 6: the government */
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.post { display: grid; gap: 6px; align-content: start; padding: 10px; min-height: 84px; background: var(--paper); color: var(--navy); border-bottom: 4px solid var(--pc, var(--gold)); animation: flip .55s ease both; animation-delay: calc(var(--i) * 50ms); }
@keyframes flip { from { transform: rotateX(90deg); opacity: 0; } }
.post b { font-weight: 800; font-size: 14.5px; line-height: 1.25; }
.post small { font-size: 12.5px; color: var(--navy-muted); display: flex; align-items: center; gap: 6px; }
.post.is-me { background: #fff7dc; box-shadow: 0 0 0 3px var(--gold-hi); }
.ledger { display: grid; gap: 6px; }
.ledger li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; padding: 8px 10px; background: var(--paper); color: var(--navy); border-inline-start: 6px solid var(--lc); }
.ledger .mk { grid-row: span 2; font-weight: 900; font-size: 13px; padding: 2px 8px; color: #fff; background: var(--lc); white-space: nowrap; }
.ledger b { font-weight: 800; font-size: 14.5px; line-height: 1.35; }
.ledger small { color: var(--navy-muted); font-size: 13px; line-height: 1.4; }
.ledger .ok { --lc: var(--good-ink); } .ledger .half { --lc: var(--warn-ink); } .ledger .no { --lc: var(--bad-ink); }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.stat div { display: grid; gap: 2px; padding: 10px 12px; background: rgba(255,255,255,.06); border-top: 4px solid var(--gold); }
.stat small { color: var(--muted); font-weight: 700; font-size: 13px; }
.stat b { font-weight: 900; font-size: 24px; line-height: 1.15; }
.life { font-size: 15px; line-height: 1.5; padding: 10px 12px; background: rgba(200, 16, 46, .16); border-inline-start: 6px solid var(--studio); }

/* bottom: footer line, Knesset, ticker */
.foot { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.bottom { min-width: 0; }
.knesset { display: block; width: 100%; max-width: 100%; height: auto; margin-top: 4px; }
.ticker { position: relative; overflow: hidden; background: var(--paper); color: var(--navy); border-top: 3px solid var(--gold); display: flex; align-items: stretch; min-height: 38px; }
.ticker b { flex: none; display: inline-flex; align-items: center; background: var(--studio); color: #fff; font-weight: 900; padding: 6px 14px; z-index: 1; }
.ticker .crawl { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; }
.ticker .crawl span { white-space: nowrap; font-weight: 700; font-size: 14px; padding-inline-start: 100%; animation: crawl 34s linear infinite; }
@keyframes crawl { to { transform: translateX(100%); } }
.wipe { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: linear-gradient(90deg, transparent, var(--night-2) 20%, var(--night-1) 80%, transparent); border-inline: 6px solid var(--gold); transform: translateX(108%); }
.wipe.run { animation: wipeX .7s cubic-bezier(.6,0,.3,1) both; }
@keyframes wipeX { 0% { transform: translateX(-108%); } 45%, 55% { transform: translateX(0); } 100% { transform: translateX(108%); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .app *, .app *::before, .app *::after, .wipe { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } .ticker .crawl span { padding-inline-start: 0; } }

      why: S.inGov ? (v.passed ? `עם ${N(ME)} בפנים, לקואליציה היו ${T_WITH}. קול אחד שזז לא שינה את התוצאה.` : 'גם עם הכרית, הנמנעים וחבר הכנסת שזז הפילו אותה.') : (v.passed ? `${T_NONE} מספיקים כשכולם מצביעים בעד.` : `ממשלה של ${T_NONE} בדיוק נפלה בגלל חבר כנסת אחד.`) }, 'הלאה: הממשלה');
  }
  return `${head('ליל ההצבעה, מליאת הכנסת', '120 חברי כנסת מצביעים אחד אחרי השני. הממשלה קמה אם יש יותר בעד מנגד.')}
    <section class="card plenum" aria-label="ההצבעה במליאה">
      <svg class="hemi" id="hemi" viewBox="0 0 440 222" role="img" aria-label="120 המושבים במליאה">${circles}<text id="h-n" x="220" y="204" text-anchor="middle">${S.rolled} מתוך 120</text></svg>
      <div class="count"><div style="--cc:var(--good)"><small>בעד</small><b id="c-for">${c.for}</b></div><div style="--cc:var(--bad)"><small>נגד</small><b id="c-against">${c.against}</b></div><div style="--cc:var(--abst)"><small>נמנעים</small><b id="c-abstain">${c.abstain}</b></div></div>
      <p class="now" id="now">${S.rolled ? `עכשיו מצביעים: <b>${esc(N(shown[shown.length - 1].x))}</b>` : 'יושב ראש הכנסת פותח את ההצבעה.'}</p>
    </section>
    ${mid}${res}`;
}

// =====================================================================================================
// Scene 6: the government
// =====================================================================================================
function cabinet() {
  const m = Object.fromEntries(D.ministers.map((x) => [x.post, x.party]));
  const items = S.inGov && S.deal ? S.deal.items : [];
  const spare = ['MIN-EDU', 'MIN-INT'];
  for (const k of items.filter((k) => k.startsWith('MIN-'))) {
    const prev = m[k];
    m[k] = ME;
    if (prev !== E) { const s = spare.find((p) => m[p] === E); if (s) m[s] = prev; }
  }
  return m;
}
function scene6() {
  const v = S.vote;
  const items = S.inGov && S.deal ? S.deal.items : [];
  const has = (k) => items.includes(k);
  const posts = cabinet();
  const grid = D.postOrder.map((k, i) => `<div class="post ${posts[k] === ME ? 'is-me' : ''}" style="--i:${i};--pc:${P(posts[k]).color}"><b>${esc(postName(k))}</b><small>${logo(posts[k], 'sm')}${esc(N(posts[k]))}</small></div>`).join('');
  const deputy = has('deputy') ? `<p class="verdict">ממלא מקום ראש הממשלה: ${esc(L(ME))}.</p>` : '';
  const draft = has('CL-DRAFT') ? 'ok' : has('CL-DRAFT~') ? 'half' : 'no';
  const health = has('CL-HEALTH') ? 'ok' : has('CL-HEALTH~') ? 'half' : 'no';
  const late = (k) => (S.delayed && S.delayed.replace('~', '') === k ? ' הסעיף נדחה בשנה.' : '');
  const MK = { ok: 'עמדתם', half: 'חלקית', no: 'לא קיבלתם' };
  const ledger = [
    { cls: S.rec === 'n' ? 'no' : 'ok', mk: S.rec === 'n' ? 'שברתם' : 'עמדתם', t: `"${D.walls['W26-14-A']}"`, s: S.rec === 'n' ? 'המלצתם על נתניהו אצל הנשיא.' : 'לא המלצתם על נתניהו ולא ישבתם איתו.' },
    { cls: 'ok', mk: 'עמדתם', t: `"${D.walls['W26-14-B']}"`, s: 'יהדות התורה וש״ס לא בממשלה.' },
    { cls: S.inGov ? draft : 'no', mk: S.inGov ? MK[draft] : 'בחוץ', t: `חוק גיוס שוויוני`, s: (S.inGov ? (draft === 'ok' ? `בקווי היסוד: ${clauseText('CL-DRAFT')}.` : draft === 'half' ? `בקווי היסוד בנוסח מרוכך: ${clauseText('CL-DRAFT', true)}.` : 'לא בהסכם שלכם.') : 'אתם לא בממשלה. הסעיף בהסכם של ביחד.') + late('CL-DRAFT') },
    { cls: S.inGov ? health : 'no', mk: S.inGov ? MK[health] : 'בחוץ', t: `"${D.pledge.textHe.split('. ').pop()}" (שבוע ${D.pledge.week} בקמפיין)`, s: (health === 'ok' ? `בקווי היסוד: ${clauseText('CL-HEALTH')}.` : health === 'half' ? `בקווי היסוד: ${clauseText('CL-HEALTH', true)}.` : 'לא נכנס להסכם.') + late('CL-HEALTH') },
  ].map((l) => `<li class="${l.cls}"><span class="mk">${esc(l.mk)}</span><b>${esc(l.t)}</b><small>${esc(l.s)}</small></li>`).join('');
  const got = items.length ? items.map(li).join('') : '<li>לא קיבלתם דבר. אתם באופוזיציה.</li>';
  const word = !v.passed ? 'לא קמה' : S.inGov ? 'תחזיק כמה חודשים' : 'רעועה';
  const byYou = !v.passed && S.waver && S.waver.id === 'lure' && S.waverVote === 'against' ? ` הקול של חבר הכנסת מ${N(YB)}, אחרי הפנייה שלכם, הכריע.` : '';
  const life = v.passed ? D.lifespan : `הממשלה לא קמה.${byYou} הנשיא יתייעץ שוב עם הסיעות לפני שיטיל את התפקיד על מישהו אחר.`;
  const spent = S.spent;
  const credLine = S.credHits.length ? `האמינות שלכם נפגעה: ${S.credHits.join('; ')}.` : 'לא שברתם אף הכרזה, והאמינות שלכם שלמה.';
  return `${head(v.passed ? 'בוקר ההשבעה' : 'הבוקר שאחרי ההצבעה', v.passed ? `${L(E)} ראש הממשלה. זה מה שקיבלתם, מול מה שהבטחתם.` : 'הממשלה לא קמה. זה מה שהיה על השולחן, ומה זה עלה לכם.')}
    <section class="stat" aria-label="השורה התחתונה">
      <div><small>הממשלה</small><b>${esc(word)}</b></div>
      <div><small>ההצבעה</small><b>${v.for} בעד, ${v.against} נגד</b></div>
      <div><small>הון פוליטי שהוצא</small><b>${spent} מתוך ${D.capital}</b></div>
    </section>
    <p class="life">${esc(life)}</p>
    ${v.passed ? `<section class="card"><h2>מי יושב איפה</h2><div class="posts">${grid}</div>${deputy}</section>` : ''}
    <section class="card"><h2>${S.inGov ? 'מה קיבלתם' : 'מה קיבלתם'}</h2><ul class="items">${got}</ul>${S.gaveDeputy ? `<p class="note">כדי להציל את ההצבעה, סגן השר במשרד שלכם יהיה מ${esc(N(YB))}.</p>` : ''}</section>
    <section class="card"><h2>מה הבטחתם בקמפיין</h2><ul class="ledger">${ledger}</ul><p class="note">${esc(credLine)}</p></section>
    <div class="go"><button type="button" class="btn btn-primary" data-act="restart">התחלה מחדש</button></div>`;
}

// =====================================================================================================
// rendering and events
// =====================================================================================================
const RENDER = [scene1, scene2, scene3, scene4, scene5, scene6];
function drawDots() {
  const el = document.getElementById('dots');
  el.setAttribute('aria-label', `השלב: ${SCENES[S.scene]}`);
  el.innerHTML = SCENES.map((n, i) => `<i class="${i < S.scene ? 'done' : i === S.scene ? 'cur' : ''}" title="${esc(n)}"></i>`).join('');
}
function drawTick() {
  const lines = ['כחול לבן בכנסת עם 5 מנדטים', ...D.board.map((t) => t.replace(/ \(.*\)$/, ''))].concat(S.ticks);
  document.getElementById('tick').textContent = lines.slice(-6).join(' · ');
}
function renderScene() {
  document.getElementById('scene').innerHTML = RENDER[S.scene]();
}
function render() {
  drawDots();
  document.getElementById('me').innerHTML = `${photo(ME, 'sm')}<span>אתם: <b>${esc(N(ME))}</b>, בראשות ${esc(L(ME))} · ${P(ME).seats} מנדטים</span>`;
  drawTick();
  renderScene();
}
function goNext() {
  timers.forEach(clearTimeout); timers = [];
  const w = document.getElementById('wipe');
  w.classList.remove('run'); void w.offsetWidth; if (!REDUCED) w.classList.add('run');
  later(() => {
    S.scene += 1; S.step = 'choose'; S.result = null; S.reply = null;
    render();
    window.scrollTo(0, 0);
    if (S.scene === 4) scene5Start();
  }, 320);
}
function restart(seed) {
  timers.forEach(clearTimeout); timers = [];
  S = fresh(seed == null ? (Math.random() * 2 ** 31) >>> 0 : seed);
  render();
  window.scrollTo(0, 0);
}
const scrollToFlash = () => later(() => { const f = document.getElementById('flash'); if (f) f.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }, 60);
const CHOOSE = [scene1Choose, scene2Choose, scene3Choose, scene4Choose, scene5Choose];
document.getElementById('app').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, arg = b.dataset.arg;
  if (act === 'restart') return restart();
  if (act === 'next') return goNext();
  if (act === 'pick') { S.picks = S.picks.includes(arg) ? S.picks.filter((k) => k !== arg) : S.picks.concat(arg).slice(-2); return renderScene(); }
  if (act === 'take' || act === 'decline') { takeReply(act === 'take'); renderScene(); return scrollToFlash(); }
  if (act === 'choose') {
    if (S.step !== 'choose' && !(S.scene === 4 && S.step === 'waver')) return;
    CHOOSE[S.scene](arg);
    renderScene();
    if (S.scene !== 4) scrollToFlash();
  }
});
window.stage3Demo = { restart, state: () => S };
const qSeed = Number(new URLSearchParams(location.search).get('seed'));
restart(Number.isFinite(qSeed) && qSeed > 0 ? qSeed : null);
})();
</script>
