<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="claude:viewport-fit-sides" content="cover">
<title>מרקטינג מנג'ר: הדרך לשותפות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Secular+One&display=swap">
<style>
/* מרקטינג מנג'ר: הדרך לשותפות — styles
   Tokens first (light on :root), dark under prefers-color-scheme and [data-theme].
   Logical properties only. Display font only on screen titles. */

:root {
  --bg: #f3efe7;
  --bg-2: #e9e3d6;
  --surface: #fffdf8;
  --surface-2: #f5f1e8;
  --line: rgba(20, 28, 48, .12);
  --line-strong: rgba(20, 28, 48, .22);
  --text: #141b2d;
  --muted: #545e72;
  --faint: #7a8396;
  --navy: #0e1a33;
  --navy-2: #172a4f;
  --navy-ink: #ffffff;
  --gold: #d6a536;
  --gold-ink: #7d5a0e;
  --gold-soft: rgba(214, 165, 54, .18);
  --danger: #b42318;
  --danger-soft: rgba(180, 35, 24, .12);
  --ok: #217a4b;
  --ok-soft: rgba(33, 122, 75, .14);
  --muted-soft: rgba(84, 94, 114, .14);
  --navy-soft: rgba(14, 26, 51, .10);
  --focus: #2563eb;
  --overlay: rgba(14, 26, 51, .45);
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --shadow-1: 0 1px 2px rgba(15, 20, 35, .06), 0 2px 8px rgba(15, 20, 35, .06);
  --shadow-2: 0 8px 28px rgba(15, 20, 35, .12), 0 2px 6px rgba(15, 20, 35, .06);
  --shadow-3: 0 18px 50px rgba(15, 20, 35, .22);
  --font: "IBM Plex Sans Hebrew", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --font-display: "Secular One", "IBM Plex Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --t-fast: 140ms;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --tabbar-h: 58px;
  --gutter-s: max(16px, env(safe-area-inset-left, 0px));
  --gutter-e: max(16px, env(safe-area-inset-right, 0px));
  --fs: 16px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1120;
    --bg-2: #0e182c;
    --surface: #121d33;
    --surface-2: #172442;
    --line: rgba(183, 195, 224, .18);
    --line-strong: rgba(183, 195, 224, .36);
    --text: #eef2f9;
    --muted: #b7c3e0;
    --faint: #8390a8;
    --navy: #1d3a80;
    --navy-2: #2a4a95;
    --navy-ink: #ffffff;
    --gold: #e4b84e;
    --gold-ink: #f6e19a;
    --gold-soft: rgba(228, 184, 78, .2);
    --danger: #ff8f87;
    --danger-soft: rgba(255, 143, 135, .16);
    --ok: #6fd39c;
    --ok-soft: rgba(111, 211, 156, .16);
    --muted-soft: rgba(183, 195, 224, .14);
    --navy-soft: rgba(122, 167, 255, .16);
    --focus: #8fb3ff;
    --overlay: rgba(2, 6, 16, .6);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-2: 0 10px 26px rgba(0, 0, 0, .42);
    --shadow-3: 0 18px 48px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1120;
  --bg-2: #0e182c;
  --surface: #121d33;
  --surface-2: #172442;
  --line: rgba(183, 195, 224, .18);
  --line-strong: rgba(183, 195, 224, .36);
  --text: #eef2f9;
  --muted: #b7c3e0;
  --faint: #8390a8;
  --navy: #1d3a80;
  --navy-2: #2a4a95;
  --navy-ink: #ffffff;
  --gold: #e4b84e;
  --gold-ink: #f6e19a;
  --gold-soft: rgba(228, 184, 78, .2);
  --danger: #ff8f87;
  --danger-soft: rgba(255, 143, 135, .16);
  --ok: #6fd39c;
  --ok-soft: rgba(111, 211, 156, .16);
  --muted-soft: rgba(183, 195, 224, .14);
  --navy-soft: rgba(122, 167, 255, .16);
  --focus: #8fb3ff;
  --overlay: rgba(2, 6, 16, .6);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-2: 0 10px 26px rgba(0, 0, 0, .42);
  --shadow-3: 0 18px 48px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

:root[data-size="sm"] { --fs: 14.5px; }
:root[data-size="lg"] { --fs: 18px; }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  overflow-wrap: anywhere;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
h1.title, .screen-title { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; letter-spacing: .01em; }
h2 { font-size: 1.1rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .6em; }
p:last-child { margin-block-end: 0; }
a { color: var(--navy); }
button, input, select, textarea { font: inherit; color: inherit; }
input, textarea, select { unicode-bidi: plaintext; }
bdi { unicode-bidi: isolate; }
.num, .chip-num, .gauge-n, .week-chip, .stamp, td.n, .tab-num { font-variant-numeric: tabular-nums; }
img, svg { max-inline-size: 100%; }
textarea { max-inline-size: 100%; }
[hidden] { display: none !important; }
.sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
button:focus:not(:focus-visible) { outline: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---------- shell / layout ---------- */
.shell {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 100vh;
  min-height: 100dvh;
}
.sidenav { display: none; }
.content {
  min-inline-size: 0;
  padding-inline-start: var(--gutter-s);
  padding-inline-end: var(--gutter-e);
  padding-block: 12px calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom, 0px));
  max-inline-size: 1100px;
  inline-size: 100%;
  margin-inline: auto;
}
.topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 6px 10px;
  border-block-end: 1px solid var(--line);
  margin-block-end: 14px;
}
.topbar .grow { flex: 1 1 auto; min-inline-size: 0; }
.brand { font-family: var(--font-display); font-size: 1.05rem; color: var(--navy); white-space: nowrap; }
.week-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--navy); color: var(--navy-ink);
  border-radius: 999px; padding: 4px 12px; font-size: .85rem; font-weight: 500; white-space: nowrap;
}
.energy-mini { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); min-inline-size: 0; }
.energy-mini .bar { inline-size: 64px; }

.tabbar {
  position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-block-start: 1px solid var(--line);
  padding-block-end: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -2px 12px rgba(0, 0, 0, .06);
}
.tabbar button {
  appearance: none; background: none; border: 0; padding: 8px 2px 6px;
  color: var(--muted); font-size: .72rem; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-block-size: var(--tabbar-h); cursor: pointer; position: relative;
}
.tabbar button .ico { font-size: 1.15rem; line-height: 1; }
.tabbar button[aria-current="page"] { color: var(--navy); }
.tabbar button[aria-current="page"]::after { content: ""; position: absolute; inset-block-start: 0; inset-inline: 22%; block-size: 3px; background: var(--gold); border-radius: 0 0 3px 3px; }
.tabbar .badge, .sidenav .badge {
  position: absolute; inset-block-start: 6px; inset-inline-end: 18%;
  background: var(--danger); color: #fff; font-size: .65rem; border-radius: 999px; padding: 0 5px; min-inline-size: 16px; line-height: 16px; text-align: center;
}

@media (min-width: 900px) {
  .shell { grid-template-columns: 230px minmax(0, 1fr); }
  .sidenav {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; inset-block-start: 0; block-size: 100vh; block-size: 100dvh; overflow-y: auto;
    background: var(--surface); border-inline-end: 1px solid var(--line);
    padding: 18px 12px; padding-inline-start: var(--gutter-s);
  }
  .sidenav .brand { padding: 4px 10px 14px; font-size: 1.2rem; }
  .sidenav button {
    appearance: none; background: none; border: 0; text-align: start; cursor: pointer;
    padding: 9px 12px; border-radius: var(--r-sm); color: var(--muted); font-weight: 500; position: relative;
    display: flex; align-items: center; gap: 10px;
  }
  .sidenav button:hover { background: var(--surface-2); color: var(--text); }
  .sidenav button[aria-current="page"] { background: var(--navy-soft); color: var(--navy); }
  .sidenav .badge { inset-block-start: 50%; transform: translateY(-50%); inset-inline-end: 10px; }
  .sidenav .sep { border-block-start: 1px solid var(--line); margin-block: 8px; }
  .tabbar { display: none; }
  .content { padding-block-end: 40px; padding-inline-start: 28px; padding-inline-end: max(28px, env(safe-area-inset-right, 0px)); }
}

/* ---------- generic components ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 14px; box-shadow: var(--shadow-1); min-inline-size: 0;
}
.card + .card, .stack > * + * { margin-block-start: 12px; }
.card-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-block-end: 8px; }
.card-h h2, .card-h h3 { flex: 1 1 auto; min-inline-size: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 700px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: .85rem; }
.xs { font-size: .75rem; }
.danger { color: var(--danger); }
.ok { color: var(--ok); }
.gold-ink { color: var(--gold-ink); }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-inline-size: 0; }
.row > .grow { flex: 1 1 auto; min-inline-size: 0; }
.between { justify-content: space-between; }
.mt { margin-block-start: 12px; }
.mb { margin-block-end: 12px; }
.section-title { display: flex; align-items: baseline; gap: 10px; margin-block: 18px 10px; }
.section-title h2 { flex: 1 1 auto; }
.empty { color: var(--faint); text-align: center; padding: 22px 10px; border: 1px dashed var(--line-strong); border-radius: var(--r-md); }
.soon { color: var(--faint); font-size: .85rem; font-style: italic; }
.divider { border: 0; border-block-start: 1px solid var(--line); margin-block: 12px; }
.notice { background: var(--gold-soft); border: 1px solid rgba(214, 165, 54, .4); border-radius: var(--r-md); padding: 10px 12px; }
.notice-danger { background: var(--danger-soft); border-color: rgba(180, 35, 24, .3); }
.notice-ok { background: var(--ok-soft); border-color: rgba(33, 122, 75, .3); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* buttons */
.btn {
  appearance: none; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--text); border-radius: var(--r-sm); padding: 8px 14px; font-weight: 500; line-height: 1.25;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-block-size: 40px;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
  max-inline-size: 100%;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--gold); border-color: var(--gold); color: #1a1405; font-weight: 600; }
.btn-primary:hover { background: #e2b448; }
:root[data-theme="dark"] .btn-primary:hover { background: #f0c85c; }
.btn-navy { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.btn-navy:hover { background: var(--navy-2); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--navy); }
.btn-ghost:hover { background: var(--navy-soft); }
.btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn-danger:hover { background: var(--danger-soft); }
.btn-sm { padding: 4px 10px; min-block-size: 32px; font-size: .85rem; }
.btn-block { inline-size: 100%; }
.btn-icon { padding-inline: 8px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns.end { justify-content: flex-end; }

.sticky-end {
  position: sticky; inset-block-end: calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom, 0px));
  z-index: 20; margin-block-start: 16px; display: flex; justify-content: center;
}
.sticky-end .btn { box-shadow: var(--shadow-2); min-block-size: 48px; padding-inline: 26px; font-size: 1.05rem; }
@media (min-width: 900px) { .sticky-end { inset-block-end: 16px; justify-content: flex-end; } }

/* pills */
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px;
  font-size: .74rem; font-weight: 500; line-height: 1.6; background: var(--muted-soft); color: var(--muted); white-space: nowrap;
  max-inline-size: 100%;
}
.pill-navy { background: var(--navy-soft); color: var(--navy); }
.pill-gold { background: var(--gold-soft); color: var(--gold-ink); }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-danger { background: var(--danger-soft); color: var(--danger); }
.pill-outline { background: transparent; border: 1px solid var(--line-strong); }
.pill-solid { background: var(--navy); color: var(--navy-ink); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill.sel { outline: 2px solid var(--gold); }

/* bars and gauges */
.bar { position: relative; block-size: 8px; background: var(--muted-soft); border-radius: 999px; overflow: hidden; inline-size: 100%; min-inline-size: 40px; }
.bar > i { position: absolute; inset-block: 0; inset-inline-start: 0; inline-size: 0; background: var(--navy); border-radius: 999px; transition: inline-size var(--t-fast) var(--ease); }
.bar.thin { block-size: 5px; }
.bar.gold > i { background: var(--gold); }
.bar.ok > i { background: var(--ok); }
.bar.danger > i { background: var(--danger); }
.bar.muted > i { background: var(--muted); }
.bar .mark { position: absolute; inset-block: -2px; inline-size: 2px; background: var(--gold-ink); opacity: .7; }
.gauge { display: flex; flex-direction: column; gap: 4px; min-inline-size: 0; }
.gauge .lbl { display: flex; justify-content: space-between; gap: 6px; font-size: .8rem; color: var(--muted); }
.gauge-n { font-weight: 600; color: var(--text); }
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }

/* attribute rows (FM style) */
.attr-group { margin-block-end: 14px; }
.attr-group.locked { opacity: .55; }
.attr-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(60px, 2fr) 44px 18px; align-items: center; gap: 10px; padding: 6px 0; border-block-end: 1px solid var(--line); font-size: .92rem; }
.attr-row:last-child { border-block-end: 0; }
.attr-row .name { min-inline-size: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.attr-row .bar { block-size: 7px; }
.chip-num { display: inline-block; min-inline-size: 40px; text-align: center; font-weight: 600; font-size: .82rem; padding: 2px 6px; border-radius: 6px; }
.b1 { background: var(--danger-soft); color: var(--danger); }
.b2 { background: var(--muted-soft); color: var(--muted); }
.b3 { background: var(--ok-soft); color: var(--ok); }
.b4 { background: var(--gold-soft); color: var(--gold-ink); }
.bar.b1 > i { background: var(--danger); }
.bar.b2 > i { background: var(--muted); }
.bar.b3 > i { background: var(--ok); }
.bar.b4 > i { background: var(--gold); }
.arrow { font-size: .75rem; text-align: center; }
.arrow.up { color: var(--ok); }
.arrow.down { color: var(--danger); }
.arrow.flat { color: var(--faint); }
@media (max-width: 480px) { .attr-row { grid-template-columns: minmax(0, 1fr) minmax(50px, 1fr) 44px 16px; gap: 6px; } }

/* avatars & inbox */
.avatar { flex: none; inline-size: 38px; block-size: 38px; border-radius: 50%; background: var(--navy); color: var(--navy-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: .85rem; }
.avatar.sm { inline-size: 30px; block-size: 30px; font-size: .75rem; }
.avatar.gold { background: var(--gold); color: #1a1405; }
.avatar.muted { background: var(--muted); }
.inbox-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.inbox-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-block-end: 1px solid var(--line); cursor: pointer; text-align: start; background: none; border-inline: 0; border-block-start: 0; inline-size: 100%; color: inherit; position: relative; }
.inbox-row:last-child { border-block-end: 0; }
.inbox-row:hover { background: var(--surface-2); }
.inbox-row .subj { font-weight: 500; min-inline-size: 0; }
.inbox-row.unread .subj { font-weight: 600; }
.inbox-row .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .78rem; color: var(--muted); margin-block-start: 2px; }
.inbox-row .dot { inline-size: 9px; block-size: 9px; border-radius: 50%; background: var(--gold); flex: none; }
.inbox-row .dot.off { background: transparent; }
.inbox-row .wk { font-size: .78rem; color: var(--faint); white-space: nowrap; }
.inbox-row.done { opacity: .6; }

/* budget */
.budget { display: flex; flex-direction: column; gap: 8px; }
.budget-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { appearance: none; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: .84rem; display: inline-flex; align-items: center; gap: 6px; color: var(--text); min-block-size: 34px; max-inline-size: 100%; }
.chip:hover { background: var(--surface-2); }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.chip .cost { color: var(--faint); font-size: .72rem; }
.chip.sel { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.plan-list { display: flex; flex-direction: column; gap: 6px; }
.plan-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface-2); border-radius: var(--r-sm); font-size: .88rem; }
.plan-item .grow { flex: 1 1 auto; min-inline-size: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; max-inline-size: 100%; }
.seg button { appearance: none; border: 0; background: none; padding: 6px 14px; cursor: pointer; color: var(--muted); font-weight: 500; min-block-size: 36px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }
.seg.gold button[aria-pressed="true"] { background: var(--gold); color: #1a1405; }

/* engagement cards */
.eng-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; box-shadow: var(--shadow-1); }
.eng-card .card-h { margin-block-end: 6px; }
.eng-card .dl { font-size: .8rem; color: var(--muted); }
.eng-card .dl.over { color: var(--danger); font-weight: 600; }
.phase-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-block: 8px; }
.phase-track span { block-size: 6px; border-radius: 3px; background: var(--muted-soft); position: relative; }
.phase-track span.done { background: var(--ok); }
.phase-track span.cur { background: var(--gold); }
.phase-labels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; font-size: .62rem; color: var(--faint); text-align: center; }
.phase-labels span.cur { color: var(--gold-ink); font-weight: 600; }
.finding { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-block-start: 1px solid var(--line); font-size: .9rem; }
.contact-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: .9rem; }
.contact-row .bar { inline-size: 90px; flex: none; }

ling, attribute evaluation table, 5% risk of overreliance","he":"בתעשייה, בדגימת תכונות של {n} פריטים ללא חריגות, הגבול העליון לשיעור החריגה באוכלוסייה הוא עד ~{upper}% ברמת ביטחון {conf}%. כך נראה מדגם שתומך בשיעור נסבל של 5% בבקרת מפתח."}],"cast":[{"id":"naama","name":"נעמה שחר","gender":"f","role":"mentor","title":"שותפה, אופק ביקורת פנימית","firmId":"ofek","temper":"supportive","trust0":55,"memoryKeys":["naama.note_sent","naama.left","naama.followed","naama.sponsored","naama.disappointed"],"bio":"שותפה באופק ומי שגייסה אתכם. עשרים שנה בביקורת ציבורית, מאמינה שממצא טוב הוא ממצא שהגזבר מבין. שולחת פתק של שתי שורות אחרי כל החלטה חלשה — ובעונה השלישית עוברת לגולדשטיין–ברק ומשאירה אתכם בלי ספונסר.","lines":{"note":"«תהליך טוב, תוצאה רעה: זה קורה. תהליך רע, תוצאה טובה: זה מזל. {תבדוק|תבדקי} איזה מהשניים זה היה.»","quarter":"«אני לא מסתכלת על מה יצא. אני מסתכלת על מה ידעת לפני שהחלטת.»","leaving":"«אני עוברת לגולדשטיין–ברק. לא בגללך. אבל {תחשוב|תחשבי} מה זה אומר {עליך|עלייך} ועל מי שיגן {עליך|עלייך} בדיון הקידום.»"}},{"id":"uri","name":"אורי לב","gender":"m","role":"manager","title":"מנהל התקשרות, אופק ביקורת פנימית","firmId":"ofek","temper":"political","trust0":45,"memoryKeys":["uri.shortcut_taken","uri.shortcut_refused","uri.overruled","uri.backed_me","uri.missed_finding"],"bio":"מנהל ההתקשרות הראשון שלכם. מודד הכול בשעות חיוב: תיק שנסגר בזמן הוא תיק טוב. קיצורי הדרך שלו מעלים את אמון הפירמה עכשיו — ומזרעים «ממצא שהוחמץ» שיצוץ שתיים עד ארבע עונות אחר-כך, עם השם שלכם על הדוח.","lines":{"shortcut":"«{תקשיב|תקשיבי}, יש לנו תקציב של 60 שעות על התיק הזה ואנחנו ב-55. {תיקח|תקחי} מה שהלקוח הכין ונתקדם.»","quarter":"«שלוש ההחלטות הכי חלשות שלך ברבעון. לא כדי להעניש — כדי שלא נראה אותן שוב.»","praise":"«זה היה נקי. {תמשיך|תמשיכי} ככה ואני אדאג שידעו למעלה.»"}},{"id":"tom","name":"תום אלקיים","gender":"m","role":"rival","title":"אנליסט, אותה מחזור גיוס","firmId":"ofek","temper":"charming","trust0":40,"memoryKeys":["tom.promoted_first","tom.helped_me","tom.undercut_me","tom.ally_in_committee","tom.left_firm"],"bio":"גויס באותו שבוע כמוכם, מדבר בביטחון של מי שכבר מנהל. מקודם לפניכם בכל פעם שאמון הפירמה שלכם נמוך, ומדי פעם — בוועדה עוינת — בן הברית היחיד בחדר.","lines":{"gossip":"«{קח|קחי} את מה שנתנו לך, מי יבדוק? יש לך עוד שני תיקים.»","promoted":"«לא ידעתי שזה יהיה אני. ברצינות. {תגיד|תגידי} אם {אתה צריך|את צריכה} משהו.»","ally":"«רגע, אני הייתי בשטח איתם. הממצא מבוסס. אני חתום עליו גם.»"}},{"id":"dalia","name":"רו״ח דליה מזרחי","gender":"f","role":"acChair","title":"יושבת-ראש ועדת הביקורת, מגדלור גמל ופנסיה","clientId":"provident-migdalor","temper":"blunt","trust0":35,"memoryKeys":["dalia.downgraded","dalia.held_rating","dalia.quoted_me","dalia.cut_me_off","dalia.recommended_me"],"bio":"יושבת-ראש ועדת הביקורת של מגדלור, רואת חשבון שהייתה שותפה בפירמה גדולה ופרשה כדי לשבת בוועדות. קוראת כל דוח עד הנספח האחרון, שומרת את כולם, וזוכרת כל ממצא שהורדתם בדירוג — גם שלוש עונות אחורה.","lines":{"opening":"«יש לכם חמש-עשרה דקות. אני קראתי את הדוח. {תספר|תספרי} לי מה לא כתוב בו.»","remembers":"«בעונה שעברה זה היה ׳ליקוי משמעותי׳ ובדוח הסופי הפך ל׳ליקוי׳. מי ביקש, ולמה הסכמת?»","respect":"«זה הדוח הראשון מהפירמה שלכם שלא ניסה לרצות אף אחד. תמשיכו.»"}},{"id":"yossi","name":"יוסי ברקת","gender":"m","role":"treasurer","title":"גזבר, מועצה אזורית צפון","clientId":"muni-north","temper":"charming","trust0":35,"memoryKeys":["yossi.small_council","yossi.files_accepted","yossi.files_refused","yossi.sod_finding","yossi.offended"],"bio":"גזבר המועצה עשרים שנה, חבר ועדת המכרזים, חותם על הצ׳קים ומכיר כל ספק בשם פרטי. מקסים, מכניס אורחים, ומשוכנע באמת ובתמים ש«אנחנו מועצה קטנה» הוא טיעון מקצועי. מרכזי למסלול הציבורי כולו.","lines":{"small_council":"«אנחנו מועצה קטנה. מי יאשר במקומי? אין לי עוד עובד. {תכתוב|תכתבי} מה {שאתה רוצה|שאת רוצה}, אני אסביר לוועדה.»","files":"«הכנתי לכם תיקייה מסודרת, עשרים תיקי רכש, הכול עם אישורים. חבל לכם על הזמן בארכיון.»","thanks":"«הממצא שלכם נכון. לא נעים לי, אבל נכון. המנכ״ל אישר לי עובד.»"}},{"id":"anat","name":"ענת קרן","gender" אקראיות היא אובייקטיביות","quality":1},{"t":"20 תיקים מהשכבה בסיכון גבוה + 10 אקראיים מהשאר, והיחס מתועד בנייר העבודה","quality":3},{"t":"30 תיקים מהסיכון הגבוה בלבד, כי שם הרגולטור מסתכל","quality":2},{"t":"15 מהסיכון הגבוה ו-15 מהתיקים שהלקוח כבר הכין, כדי לחסוך זמן","quality":0}],"why":"דגימה מבוססת סיכון מרכזת את המאמץ היכן שהחשיפה; מיעוט אקראי מהשאר שומר על יכולת לומר משהו על כלל האוכלוסייה. 9% מהאוכלוסייה מרכזים את רוב הסיכון — מדגם אקראי טהור צפוי לפספס אותם."},{"q":"בדגימת תכונות של 25 פריטים נמצאה חריגה אחת. מה המסקנה הנכונה?","options":[{"t":"שיעור החריגה באוכלוסייה הוא 4%, הבקרה אפקטיבית","quality":0},{"t":"הגבול העליון לשיעור החריגה הוא כ-15% ברמת ביטחון 90%; צריך להבין את החריגה ולהחליט על הרחבה","quality":3},{"t":"הבקרה נכשלה; חריגה אחת היא כישלון","quality":1},{"t":"להחליף את הפריט החורג בפריט אחר ולבדוק שוב","quality":0}],"why":"המדגם לא מודד את שיעור החריגה אלא תוחם אותו. לפי טבלאות דגימת תכונות (AICPA), 1 מתוך 25 נותן גבול עליון של כ-15% ב-90% ביטחון. חריגה אחת היא שאלה — מה גרם לה, האם היא שיטתית — לא תשובה. החלפת פריט חורג היא הטיה בוטה."},{"q":"{manager} {manager:מבקש|מבקשת} «להקטין את המדגם מ-40 ל-20 כי נגמר התקציב». מה נכון?","options":[{"t":"להקטין את המדגם ולתעד שהצמצום נובע ממגבלת שעות, עם הערכה של ההשפעה על רמת הביטחון","quality":3},{"t":"להקטין בשקט; 20 זה עדיין מדגם","quality":1},{"t":"לסרב; גודל המדגם לא נתון למשא ומתן","quality":1},{"t":"להקטין ל-20 אבל לתת ללקוח לבחור אילו 20 להוריד","quality":0}],"why":"גודל מדגם הוא טיעון, לא מספר קדוש. כשהזמן קצר מקטינים היקף ומתעדים את המחיר — לא מוותרים על עצמאות הבחירה. מדגם קטן ומתועד עדיף על מדגם גדול שהמבוקר קבע את הרכבו."},{"q":"אתם בודקים בקרת אישור תשלומים שפועלת יומית. איזו תדירות מצדיקה את המדגם הגדול ביותר, ולמה?","options":[{"t":"בקרה שנתית, כי היא חשובה יותר","quality":0},{"t":"בקרה יומית או רב-פעמית ביום: אוכלוסייה גדולה, ולכן מדגם של 25–40 פריטים בהתאם לסיכון","quality":3},{"t":"כל הבקרות מקבלות אותו מדגם של 25 כדי שיהיה אחיד","quality":1},{"t":"בקרה חודשית — 12 פריטים, כי בודקים את כולם","quality":2}],"why":"בבדיקת בקרות (ISOX) גודל המדגם נגזר מתדירות הפעלת הבקרה ומרמת הסיכון: שנתית 1, רבעונית 2, חודשית 2–5, שבועית 5–15, יומית 20–40. בקרה חודשית אכן נבדקת לרוב על 2–5 מהחודשים, לא על כולם."}]},{"id":"drill-finding-anatomy","title":"אנטומיה של ממצא: מצב · קריטריון · סיבה · השפעה · המלצה","skills":[{"id":"writing","w":0.7},{"id":"evidence","w":0.3}],"tier":[1,2],"hours":4,"items":[{"q":"איזה מהמשפטים הבאים הוא «מצב» (condition) תקין בממצא?","options":[{"t":"ב-7 מתוך 25 הזמנות רכש שנדגמו (28%) לא נמצא אישור מנהל האגף לפני ההתקשרות","quality":3},{"t":"תהליך הרכש במועצה לוקה בחסר ואינו עומד בסטנדרטים המקובלים","quality":0},{"t":"על פי נוהל הרכש של המועצה, כל הזמנה מעל 5,000 ש״ח טעונה אישור מנהל אגף","quality":1},{"t":"מומלץ להטמיע בקרה ממוחשבת שתמנע הזמנה ללא אישור","quality":1}],"why":"ה«מצב» הוא מה שנמצא בפועל: עובדות, מספרים, מקור. «לוקה בחסר» הוא שיפוט בלי עובדה. המשפט על הנוהל הוא הקריטריון, והמשפט על הבקרה הממוחשבת הוא ההמלצה — שניהם מרכיבים אחרים של אותו ממצא."},{"q":"מה ההבדל בין «סיבה» ל«השפעה» בממצא על העדר הפרדת תפקידים בגזברות?","options":[{"t":"סיבה: הגזבר גם מאשר וגם משלם. השפעה: הגזבר עלול לטעות","quality":1},{"t":"סיבה: תקן כוח אדם של עובד אחד בגזברות ואי-הגדרת בקרה מפצה. השפעה: תשלום שגוי או לא מורשה עלול להתבצע בלי שיתגלה","quality":3},{"t":"סיבה: הפרדת תפקידים לא קיימת. השפעה: הפרדת תפקידים לא קיימת","quality":0},{"t":"סיבה: חוסר במודעות. השפעה: אי-עמידה בחוזר מנכ״ל משרד הפנים","quality":1}],"why":"הסיבה מסבירה למה הפער קיים (מבנה, משאבים, נוהל חסר) — וממנה נגזרת המלצה ישימה. ההשפעה אומרת מה עלול לקרות בגלל הפער, במונחי סיכון, לא במונחי אי-ציות בלבד. «אי-עמידה בחוזר» היא הקריטריון, לא ההשפעה."},{"q":"איזו המלצה היא ישימה ונכונה לממצא על גזבר יחיד במועצה קטנה?","options":[{"t":"להקים יחידת בקרה תקציבית עם שני עובדים","quality":1},{"t":"לקבוע בקרה מפצה: אישור מנכ״ל המועצה לכל תשלום מעל סף שייקבע, וסקירה חודשית של דוח תשלומים בידי מבקרת המועצה","quality":3},{"t":"להקפיד על הפרדת תפקידים","quality":0},{"t":"לפנות למשרד הפנים לקבלת הנחיות","quality":1}],"why":"המלצה טובה אומרת מי עושה מה, באיזה סף ובאיזו תדירות — ומתאימה למשאבים הקיימים. כשאי-אפשר להפריד תפקידים, מגדירים בקרה מפצה. «להקפיד» אינו המלצה, ויחידה חדשה אינה ישימה במועצה של 180 עובדים."},{"q":"איזה «קריטריון» מתאים לממצא על מתנות שקיבלה מנהלת רכש בחברה ממשלתית מספק במהלך מכרז?","options":[{"t":"הוראת ניהול בנקאי תקין 308","quality":0},{"t":"חוזר רשות החברות הממשלתיות בנושא מתנות ואירוח ונוהל המתנות של החברה, סעיף 4","quality":3},{"t":"נורמות אתיות מקובלות","quality":1},{"t":"חוק הביקורת הפנימית התשנ״ב-1992","quality":1}],"why":"הקריטריון הוא ה«צריך להיות» הספציפי לגוף: בחברה ממשלתית — חוזרי רשות החברות ונוהל החברה עצמה. הוראה 308 חלה על בנקים; חוק הביקורת הפנימית מסדיר את הביקורת, לא את המתנות; «נורמות» אינן קריטריון שאפשר להצביע עליו."},{"q":"{contact} {contact:מבקש|מבקשת} להוריד את המילה «28%» מהממצא ולכתוב «במספר מקרים». מה נכון?","options":[{"t":"להסכים; הניסוח הרך עדיין נכון","quality":0},{"t":"להשאיר את המספר, לציין את גודל המדגם לידו, ולהוסיף את תגובת ההנהלה במלואה בסעיף נפרד","quality":3},{"t":"להחליף ל«ברוב המקרים» כפשרה","quality":0},{"t":"להשאיר את המספר ולהעלות את הדירוג כעונש על הלחץ","quality":1}],"why":"המצב נמדד; טשטוש המספר הוא הורדת דירוג בדלת האחורית. התשובה הנכונה היא דיוק (מספר + מדגם) ומתן מקום הוגן לתגובת ההנהלה. העלאת דירוג כתגובה ללחץ היא בדיוק אותה טעות בכיוון ההפוך."}]},{"id":"drill-design-vs-operating","title":"תכנון מול תפעול: איזו בקרה נכשלה ואיך","skills":[{"id":"controls","w":0.8},{"id":"testing","w":0.2}],"tier":[1,2],"hours":4,"items":[{"q":"הנוהל דורש אישור של שני מורשי חתימה לכל העברה מעל 100 אלף ש״ח. במערכת, מורשה אחד יכול לאשר לבד. איזה סוג ליקוי?","options":[{"t":"ליקוי תפעול: המורשים לא הקפידו","quality":0},{"t":"ליקוי תכנון: הבקרה כפי שמיושמת במערכת לא יכולה להשיג את מטרתה גם אם כולם יפעלו לפיה","quality":3},{"t":"אין ליקוי: הנוהל תקין","quality":0},{"t":"ליקוי תיעוד: הנוהל לא מתאר את המערכת","quality":1}],"why":"ליקוי תכנון (design) קיים כשהבקרה, גם אם תופעל כפי שנבנתה, לא מונעת או מגלה את הטעות. כאן המערכת לא אוכפת את החתימה השנייה — הבקרה בנויה לא נכון, ולא משנה כמה המורשים מקפידים."},{"q":"הבקרה מתוכננת היטב: התאמת בנק חודשית נחתמת בידי חשבת. בבדיקה: 3 מתוך 12 ההתאמות נחתמו באיחור של חודשיים. איזה סוג ליקוי?","options":[{"t":"ליקוי תכנון","quality":0},{"t":"ליקוי תפעול: הבקרה בנויה נכון אבל לא פועלת בעקביות או במועד","quality":3},{"t":"אין ליקוי: 9 מתוך 12 בסדר","quality":0},{"t":"ליקוי תפעול, אבל רק אם נמצאה טעות בהתאמה","quality":1}],"why":"ליקוי תפעול (operating) הוא כשל בביצוע: הבקרה נכונה, האנשים לא הפעילו אותה כנדרש. אפקטיביות בקרה נמדדת בעקביות ובמועד, לא רק בשאלה אם קרתה טעות — התאמה שנחתמת אחרי חודשיים לא הייתה מגלה טעות בזמן."},{"q":"מה בודקים ב«מעבר» (walkthrough) של בקרה לפני בדיקת האפקטיביות התפעולית?","options":[{"t":"דוגמים 25 פריטים ובודקים שהבקרה בוצעה","quality":0},{"t":"עוקבים אחרי עסקה אחת מתחילתה ועד סופה, מאמתים שהבקרה קיימת, מי מבצע, איזו ראיה נשארת, ומה קורה כשהיא נכשלת","quality":3},{"t":"קוראים את הנוהל ומסמנים אם הוא מעודכן","quality":1},{"t":"מראיינים את מנהל האגף ושואלים אם הבקרה עובדת","quality":1}],"why":"המעבר מאמת את תכנון הבקרה ואת קיומה בפועל על עסקה אחת, ומזהה את הראיה שתידגם אחר-כך. בלי מעבר, בדיקת 25 פריטים עלולה לבדוק את הבקרה הלא נכונה. ראיון לבדו אינו ראיה לקיום הבקרה."},{"q":"איזו מהבקרות הבאות היא בקרה מונעת (preventive) ולא מגלה (detective)?","options":[{"t":"סקירה חודשית של דוח חריגים בהרשאות","quality":0},{"t":"חסימה במערכת של יצירת ספק חדש ללא אישור מנהל רכש","quality":3},{"t":"ספירת מלאי רבעונית","quality":0},{"t":"התאמת בנק חודשית","quality":0}],"why":"בקרה מונעת עוצרת את הפעולה לפני שהיא קורית (חסימה במערכת, אישור מוקדם). בקרה מגלה מזהה אחרי המעשה (סקירה, ספירה, התאמה). סביבת בקרה טובה משלבת את שתיהן, אבל ממצא על בקרה מגלה בלבד בתהליך בסיכון גבוה הוא ממצא תכנון."},{"q":"בקרה ממוחשבת בודקת שסכום החשבונית תואם להזמנה. הבדיקה שלכם מצאה שהבקרה פועלת, אבל הרשאת «עקיפה» פתוחה ל-14 משתמשים. מה המסקנה?","options":[{"t":"הבקרה אפקטיבית; העקיפה היא נושא של IT","quality":0},{"t":"ליקוי תכנון בבקרה: בקרה שאפשר לעקוף בלי אישור ובלי תיעוד אינה בקרה; יש לצמצם את ההרשאה ולתעד כל עקיפה","quality":3},{"t":"ליקוי תפעול: 14 זה יותר מדי","quality":1},{"t":"לבדוק אם מישהו עקף בפועל; אם לא — אין ממצא","quality":1}],"why":"אפקטיביות בקרה אוטומטית תלויה בבקרות הכלליות סביבה (הרשאות, שינויים). עקיפה פתוחה ללא בקרה היא פגם בתכנון, גם אם איש לא עקף השנה — כי המבחן הוא «האם הבקרה יכולה להיכשל», לא «האם היא נכשלה»."}]},{"id":"drill-sod-access","title":"הפרדת תפקידים והרשאות","skills":[{"id":"controls","w":0.6},{"id":"risk","w":0.4}],"tier":[1,2],"hours":4,"items":[{"q":"איזה צירוף תפקידים הוא הפרת הפרדת תפקידים הקלאסית במחזור הרכש?","options":[{"t":"מי שמקליט ספק חדש במערכת הוא גם מי שמאשר את התשלום לו","quality":3},{"t":"מי שמקבל סחורה הוא גם מי שסופר מלאי","quality":1},{"t":"מי שמכין את התקציב הוא גם מי שמדווח עליו למועצה","quality":1},{"t":"מי שחותם על החוזה הוא גם מי שמנהל את הקשר עם הספק","quality":0}],"why":"הפרדת תפקידים מפרידה בין אישור, רישום, משמורת על נכסים והתאמה. יצירת ספק + אישור תשלום באותן ידיים מאפשרת ספק פיקטיבי מתחילתו ועד תשלומו בלי שאיש אחר רואה. זה הצירוף שמופיע ברוב מקרי המעילה בשלטון המקומי."},{"q":"במועצה קטנה אין מספיק עובדים להפרדה מלאה. מה הבקרה המפצה הנכונה?","options":[{"t":"לוותר על ההפרדה ולתעד שזה בגלל גודל הארגון","quality":0},{"t":"סקירה תקופתית, בידי גורם בלתי תלוי (מנכ״ל או מבקרת), של דוח כל הספקים החדשים והתשלומים הראשונים להם, עם חתימה ותאריך","quality":3},{"t":"לבקש מהגזבר להצהיר בכתב שהוא לא ניצל את הגישה","quality":0},{"t":"להעביר את יצירת הספקים לחברה חיצונית","quality":1}],"why":"בקרה מפצה היא בקרה מגלה בידי מישהו שאינו חלק מהתהליך, בתדירות שמתאימה לסיכון, עם ראיה שהיא בוצעה. הצהרה אינה בקרה; תיעוד של ההעדר אינו בקרה; מיקור חוץ מעביר את הבעיה בלי לפתור את השאלה מי סוקר."},{"q":"סקירת הרשאות ב{client}: 2 משתמשים עם הרשאת מנהל-מערכת מלאה, אחד מהם עזב לפני 4 חודשים. איזה ממצא ובאיזה דירוג (סולם תכנון מול תפעול)?","options":[{"t":"הערה: צריך לסגור את המשתמש","quality":0},{"t":"ליקוי תפעול: תהליך הסרת הרשאות לעוזבים קיים אבל לא פעל; ובנוסף לבדוק אם המשתמש היה פעיל מאז העזיבה","quality":3},{"t":"ליקוי תכנון: אסור ששני אנשים יהיו מנהלי מערכת","quality":1},{"t":"ממצא על משאבי אנוש שלא דיווחו על העזיבה","quality":1}],"why":"אם קיים נוהל הסרה והוא לא בוצע — זה ליקוי תפעול, והשאלה הראשונה היא האם הייתה פעילות בחשבון מאז העזיבה (זה משנה את ההשפעה). שני מנהלי מערכת אינם ליקוי בפני עצמו; גיבוי הוא סיבה לגיטימית כשההרשאה מנוטרת."},{"q":"מנהל מערכות המידע אומר: «עשיתי הפרדת הרשאות, כל אחד רואה רק את המסך שלו». מה הראיה שתבקשו?","options":[{"t":"את דבריו, מתועדים בפרוטוקול הראיון","quality":0},{"t":"מטריצת הרשאות מהמערכת (לא ממסמך וורד), הצלבה מול רשימת העובדים ותפקידיהם, ובדיקה ישירה של 5 משתמשים","quality":3},{"t":"את נוהל ההרשאות החתום","quality":1},{"t":"צילום מסך של משתמש אחד","quality":1}],"why":"ראיה מהמערכת עדיפה על ראיה מהאדם; ראיה שהמבקר הפיק בעצמו עדיפה על ראיה שהמבוקר הכין. נוהל מוכיח תכנון, לא תפעול; צילום מסך אחד מוכיח משתמש אחד. היררכיית הראיות היא לב ה-GIAS."},{"q":"בבדיקת ניהול שינויים נמצא שמפתח התוכנה גם מעביר את הקוד לסביבת הייצור. מה הסיכון המרכזי?","options":[{"t":"המפתח יעבוד שעות נוספות","quality":0},{"t":"שינוי לא מאושר או לא נבדק יגיע לייצור, ובקרות אוטומטיות (כמו בדיקת סכום חשבונית) ישתנו בלי שאיש ידע","quality":3},{"t":"אין סיכון אם המפתח אמין","quality":0},{"t":"סיכון לאיכות הקוד","quality":1}],"why":"ניהול שינויים הוא בקרה כללית שעליה נשענות כל הבקרות האוטומטיות. אם מי שכותב גם מעלה לייצור, אין לכם ביטחון שהבקרה שבדקתם במרץ היא זו שפועלת בדצמבר. «אמינות» אינה בקרה — זו ההנחה שהבקרות קיימות כדי לא להסתמך עליה."}]},{"id":"drill-aml-red-flags","title":"איסור הלבנת הון: דגלים אדומים ואיסור גילוי","skills":[{"id":"reg","w":0.7},{"id":"evidence","w":0.3}],"tier":[1,2],"hours":4,"items":[{"q":"לקוח פרטי הפקיד 11 הפקדות במזומן של 49 אלף ש״ח כל אחת בשלושה שבועות, בסניפים שונים. מה זה?","options":[{"t":"פעילות רגילה; אף הפקדה לא חצתה את סף הדיווח","quality":0},{"t":"דפוס של פיצול (structuring) שנועד להימנע מדיווח — פעולה שעל התאגיד לבחון ולדווח עליה כפעולה בלתי רגילה","quality":3},{"t":"להתקשר ללקוח ולשאול למה הוא מפצל","quality":0},{"t":"לבקש מהסניף להפסיק לקבל ממנו מזומן","quality":1}],"why":"פיצול סכומים מתחת לסף הוא הדגל האדום הקלאסי לפי צו איסור הלבנת הון; הדיווח על פעולה בלתי רגילה אינו תלוי בסף. לשאול את הלקוח הוא «גילוי» (tipping off) — עבירה בפני עצמה. חסימה חד-צדדית בלי תיעוד ודיווח רק מעבירה אותו לבנק אחר."},{"q":"קצין הציות מבקש שתכתבו בממצא: «מומלץ ליידע את הלקוח כי פעילותו נבחנת». מה נכון?","options":[{"t":"לכתוב; שקיפות ללקוח היא ערך","quality":0},{"t":"לסרב ולהסביר שיידוע הלקוח על בדיקה או דיווח הוא איסור גילוי לפי חוק איסור הלבנת הון, ולתעד את הבקשה","quality":3},{"t":"לכתוב בניסוח רך: «לשקול יידוע»","quality":0},{"t":"לכתוב אבל לא לכלול בדוח הסופי","quality":1}],"why":"סעיף איסור הגילוי בחוק איסור הלבנת הון אוסר ליידע את מי שהפעולה שלו נבדקת או דווחה. המלצה כזאת בדוח ביקורת היא המלצה לבצע עבירה. ניסוח רך לא משנה את המהות, ובקשה כזאת מקצין ציות היא עצמה ממצא."},{"q":"איזה מהבאים הוא דגל אדום לפי צו איסור הלבנת הון בבדיקת «הכר את הלקוח»?","options":[{"t":"לקוח שמבקר בסניף פעם בחודש","quality":0},{"t":"חברה שהצהרת הנהנה שלה מצביעה על אדם שאין לו קשר נראה לעין לפעילות, ופעילות החשבון אינה תואמת את המטרה שהוצהרה בפתיחה","quality":3},{"t":"לקוח שמנהל שלושה חשבונות באותו בנק","quality":1},{"t":"לקוח שסירב לקבל כרטיס אשראי","quality":0}],"why":"ליבת הכר-את-הלקוח היא התאמה: בין הנהנה המוצהר לפעילות, בין מטרת החשבון המוצהרת למה שקורה בו. הפער הזה — לא כמות החשבונות ולא תדירות הביקורים — הוא מה שהוראה 411 והצו מצפים שהתאגיד יזהה."},{"q":"במערכת הניטור יש 1,400 התראות פתוחות מגיל 90 יום ומעלה. מה הממצא?","options":[{"t":"המערכת מייצרת יותר מדי התראות; מומלץ להעלות את הסף","quality":0},{"t":"צבר התראות לא מטופלות שמשמעותו שדיווחים על פעולות בלתי רגילות עלולים להישלח באיחור או לא להישלח; לבחון כוח אדם, כיול המערכת ותיעוד ההחלטות על סגירת התראות","quality":3},{"t":"ממצא על IT: המערכת איטית","quality":0},{"t":"לבקש מקצין הציות לסגור את הישנות כדי לנקות","quality":0}],"why":"צבר התראות הוא ממצא על אפקטיביות הניטור ועל חובת הדיווח במועד, לא על המערכת. העלאת סף או סגירה גורפת הן קיצורי דרך שהרגולטור יראה בביקורת הבאה. השאלה הנכונה: איך סוגרים התראה, מי מתעד למה, וכמה זמן זה לוקח."},{"q":"בחברה ממשלתית (לא תאגיד פיננסי) ספק מציע לכם, המבקרים, כרטיסים למשחק כדורגל. באיזו משבצת זה נופל?","options":[{"t":"איסור הלבנת הון — לדווח לרשות","quality":0},{"t":"ניגוד עניינים ועצמאות המבקר: לסרב, לדווח ל{manager:מנהל|מנהלת} ההתקשרות ולתעד; ובמקביל ממצא על נוהל המתנות של החברה אם הצעות כאלה מגיעות גם לעובדיה","quality":3},{"t":"לקבל אם זה מתחת ל-300 ש״ח","quality":0},{"t":"לסרב בשקט ולהמשיך","quality":1}],"why":"לא כל אירוע כספי הוא הלבנת הון. מתנה ממבוקר למבקר היא שאלה של אובייקטיביות (GIAS 2024, 1100) וניגוד עניינים — ולפי חוזרי רשות החברות גם של נוהל המתנות של החברה. סף כספי אינו פוטר כשהנותן הוא צד שבודקים אותו."}]},{"id":"drill-privacy-incident","title":"אירוע אבטחת מידע: תיקון 13 ומה עושים ב-72 השעות הראשונות","skills":[{"id":"reg","w":0.6},{"id":"client","w":0.4}],"tier":[1,2],"hours":4,"items":[{"q":"עובדת בחברת ביטוח שלחה קובץ אקסל עם 3,200 תביעות (שם, ת״ז, אבחנה רפואית) לכתובת מייל שגויה של סוכן. מה הסיווג?","options":[{"t":"טעות אנוש; לבקש מהסוכן למחוק","quality":1},{"t":"אירוע אבטחה חמור לפי תקנות הגנת הפרטיות (אבטחת מידע): מידע רגיש בהיקף גדול שהגיע לגורם לא מורשה — מחייב דיווח לרשות להגנת הפרטיות ותיעוד","quality":3},{"t":"אירוע רק אם הסוכן פתח את הקובץ","quality":0},{"t":"אירוע סייבר; להעביר למנהל אבטחת מידע ולסיים","quality":1}],"why":"מידע רפואי הוא «מידע בעל רגישות מיוחדת»; 3,200 רשומות הן היקף משמעותי; יציאה לגורם לא מורשה היא שימוש במידע ללא הרשאה. לפי התקנות ותיקון 13 זה אירוע חמור שמדווח לרשות, ללא תלות בשאלה אם הקובץ נפתח. מחיקה אצל הסוכן היא צעד הכלה, לא סוף הטיפול."},{"q":"מה סדר הפעולות הנכון בשעות הראשונות?","options":[{"t":"דיווח לרשות קודם כול, לפני שמבינים מה קרה","quality":1},{"t":"הכלה (ביטול גישה, בקשת מחיקה מתועדת), תיעוד העובדות (מה, מתי, למי, כמה), הערכת חומרה עם הממונה על הגנת הפרטיות, ואז דיווח לרשות ולנושאי המידע לפי הצורך","quality":3},{"t":"לחכות שבוע לראות אם מישהו מתלונן","quality":0},{"t":"לשלוח מייל לכל המבוטחים מיד","quality":1}],"why":"הכלה ותיעוד קודמים כי הם הפיכים וזולים; הדיווח צריך עובדות. אבל «להמתין» אינו אופציה — החובה היא לדווח «בהקדם האפשרי», והרשות מצפה לדיווח ראשוני גם כשהתמונה חלקית. יידוע נושאי המידע מתואם, לא אימפולסיבי."},{"q":"הממונה על הגנת הפרטיות אומרת: «אם נדווח על כל מייל שגוי, הרשות תגור אצלנו». מה התשובה המקצועית?","options":[{"t":"היא צודקת; לא לדווח על אירועים קטנים","quality":0},{"t":"להבחין: כל אירוע מתועד בפנים; דיווח לרשות הוא לאירוע חמור לפי קריטריונים (רגישות, היקף, גורם) שנקבעים מראש בנוהל — וזה אירוע כזה","quality":3},{"t":"לדווח על הכול כדי להיות בטוחים","quality":1},{"t":"לתת לה להחליט; זה התפקיד שלה","quality":1}],"why":"ההבחנה בין תיעוד פנימי (כל אירוע) לדיווח חיצוני (אירוע חמור) היא לב הנוהל. קריטריונים שנכתבו מראש מונעים את הדיון הזה בזמן אמת. «היא תחליט» הוא נכון פורמלית, אבל התפקיד שלכם הוא להביא לה את הקריטריון, לא לשתוק."},{"q":"מה תיקון 13 שינה שמשפיע ישירות על תוכנית הביקורת שלכם אצל לקוח עם מאגר גדול?","options":[{"t":"ביטל את חובת רישום המאגרים לחלוטין","quality":1},{"t":"הוסיף חובת מינוי ממונה הגנת פרטיות בגופים מסוימים, הרחיב את סמכויות האכיפה והעיצומים הכספיים של הרשות, והגדיר מחדש «מידע» ו«מידע בעל רגישות מיוחדת»","quality":3},{"t":"העביר את האכיפה למשטרה","quality":0},{"t":"חל רק על גופים ציבוריים","quality":0}],"why":"לצורך תוכנית ביקורת, שלושת השינויים המרכזיים הם: האם מונה ממונה ולמי הוא כפוף; האם הארגון ערוך לאכיפה מינהלית (עיצומים משמעותיים); והאם סיווג המידע שלו מעודכן להגדרות החדשות. תיקון 13 צמצם את חובת הרישום אך לא ביטל אותה לחלוטין."},{"q":"אתם מגלים שהאירוע התרחש לפני חודשיים ואיש לא דיווח. {contact} {contact:מבקש|מבקשת} «לא להכניס את זה לדוח, כבר טופל». מה נכון?","options":[{"t":"להסכים; האירוע הוכל","quality":0},{"t":"הממצא נשאר: אירוע חמור שלא דווח הוא ממצא על תהליך הדיווח, לא על האירוע; לעדכן את {manager:מנהל|מנהלת} ההתקשרות ולהמליץ ללקוח לדווח באיחור עם הסבר","quality":3},{"t":"להכניס לדוח בלי לדבר עם הלקוח","quality":1},{"t":"להוריד את הממצא ל«הערה»","quality":0}],"why":"הסתרת ממצא לבקשת הלקוח פוגעת ביושרה, ובאירוע שהרשות עשויה לגלות בעצמה גם מסכנת את הלקוח. דיווח מאוחר עם הסבר עדיף על אי-דיווח שמתגלה. והמלצה כזאת מסלימים ל{manager:מנהל|מנהלת} — זה לא שיקול של אנליסט לבד."}]},{"id":"drill-escalation","title":"כיול הסלמה: מתי מעלים, מתי מיידעים, מתי מחליטים לבד","skills":[{"id":"escalation","w":0.7},{"id":"judgment","w":0.3}],"tier":[1,2],"hours":4,"items":[{"q":"המתודולוגיה לדגימה ברורה, {manager} בשטח אצל לקוח אחר, והלקוח ממתין לתשובה. מה רמת ההסלמה הנכונה?","options":[{"t":"להסלים: לחכות ל{manager:מנהל|מנהלת} ולא להחליט","quality":1},{"t":"להחליט לפי המתודולוגיה ולשלוח שורת עדכון (ליידע), לא שאלה","quality":3},{"t":"להחליט ולא לעדכן; זה התיק שלי","quality":1},{"t":"לשאול את הלקוח מה היה נהוג בשנה שעברה","quality":0}],"why":"מסלימים כשחסר מידע או סמכות — לא כשחסר אומץ. כאן יש מתודולוגיה ויש סמכות; מה שצריך הוא שקיפות, כלומר יידוע. הסלמה מיותרת נרשמת כחוסר עצמאות («זאב-זאב»), ואי-יידוע נרשם כהפתעה למנהל."},{"q":"בעבודת השטח מצאתם מה שנראה כמו תשלום לספק פיקטיבי. מה עושים?","options":[{"t":"לאסוף עוד ראיות לבד במשך שבועיים לפני שמספרים למישהו","quality":1},{"t":"להסלים מיד ל{manager:מנהל|מנהלת} ההתקשרות עם מה שיש ביד, לפני כל פנייה ללקוח, ולהפסיק לשאול שאלות בשטח עד להנחיה","quality":3},{"t":"לשאול את הגזבר ישירות מה זה","quality":0},{"t":"לכתוב ממצא ולהמשיך כרגיל","quality":0}],"why":"חשד למעילה הוא גבול הסמכות של אנליסט: המשך תשאול עלול לשבש ראיות או להזהיר חשוד, והטיפול (ייעוץ משפטי, דיווח) הוא החלטה של השותף. הסלמה כאן אינה חולשה — זה הכלל. אי-הפיכות מצדיקה הסלמה מוקדמת."},{"q":"{contact} {contact:מבקש|מבקשת} לדחות את הצגת הממצאים בשבוע «כי הסמנכ״ל בחו״ל». תאריך היעד של התיק בעוד שלושה שבועות. רמת ההסלמה?","options":[{"t":"להסלים: רק {manager:המנהל|המנהלת} {manager:יכול|יכולה} לאשר דחייה","quality":1},{"t":"להסכים, ליידע את {manager:המנהל|המנהלת} בשורה, ולעדכן את לוח הזמנים של התיק","quality":3},{"t":"לסרב; תאריכים לא זזים","quality":0},{"t":"להסכים ולא לעדכן אף אחד","quality":1}],"why":"דחייה של שבוע בתוך מרווח של שלושה היא הפיכה וזולה — החלטה שלכם, עם יידוע. «הפיך — פעל; בלתי הפיך — הסלם». הסלמה כאן מעמיסה על המנהל ומאותתת ללקוח שאין לכם סמכות על לוח הזמנים של עצמכם."},{"q":"יושבת-ראש ועדת הביקורת מתקשרת אליכם ישירות ושואלת «מה באמת מצאתם» לפני הדוח. מה נכון?","options":[{"t":"לענות; היא הלקוחה","quality":0},{"t":"להשיב בנימוס שהדוח בטיוטה ושתקבל אותו דרך הערוץ המוסכם, ולהסלים את השיחה מיד ל{manager:מנהל|מנהלת} ולשותפה","quality":3},{"t":"לתת רמז כללי בלי פרטים","quality":1},{"t":"לנתק ולא לספר לאף אחד","quality":0}],"why":"פנייה ישירה מדרג שמעל הלקוח היומי עוקפת את ערוצי הדיווח המוסכמים, ומה שתגידו בטלפון יצוטט בוועדה. זה לא החלטה שלכם — זה מידע שהשותפה צריכה היום. «רמז» הוא הגרוע משני העולמות: מחייב ולא מדויק."},{"q":"אחרי שהסלמתם, {manager} {manager:מחליט|מחליטה} הפוך ממה שהצעתם, ואתם חושבים שזו טעות. מה הצעד הבא?","options":[{"t":"לעשות כמו {שאני חושב|שאני חושבת}; אני בשטח, {manager:הוא|היא} לא","quality":0},{"t":"לבצע את ההחלטה, לתעד בממו את ההמלצה שלי ואת ההחלטה שהתקבלה ולמה, ולקבוע נקודת בדיקה חוזרת","quality":3},{"t":"לפנות לשותפה מעל הראש שלו","quality":1},{"t":"לבצע ולשכוח מזה","quality":1}],"why":"הסלמה מעבירה את ההחלטה, לא את האחריות לתעד. ממו שמתעד «הצעתי X, הוחלט Y, כי Z, נבדוק בעוד 4 שבועות» הוא ההגנה שלכם ושלו — וגם הלמידה. עקיפה לשותפה שמורה למקרים של יושרה, לא של חילוקי דעות מקצועיים."}]},{"id":"drill-base-rates","title":"שיעורי בסיס: מה קורה בדרך כלל לפני מה קורה הפעם","skills":[{"id":"judgment","w":0.7},{"id":"risk","w":0.3}],"tier":[1,2],"hours":4,"items":[{"q":"בדגימת 25 פריטים לא נמצאה אף חריגה. מה אפשר לומר על שיעור החריגה באוכלוסייה ברמת ביטחון 90%?","options":[{"t":"שיעור החריגה הוא אפס","quality":0},{"t":"הגבול העליון הוא כ-9%; כלומר ייתכן שכמעט פריט אחד מכל עשרה חורג ועדיין לא היינו רואים זאת","quality":3},{"t":"הגבול העליון הוא 4% (1 חלקי 25)","quality":1},{"t":"אי-אפשר לומר כלום בלי לבדוק את כולם","quality":0}],"why":"אפס חריגות ב-25 אינו אפס באוכלוסייה. לפי דגימת תכונות (AICPA, 10% סיכון הסתמכות-יתר), הגבול העליון הוא ~9%. זה בדיוק למה «הבקרה אפקטיבית» אחרי 25 נקיים הוא מסקנה בתוך גבולות, לא עובדה."},{"q":"סקר סיכונים: מנהל תפעול מדרג «שריפה במחסן» כסיכון מספר 1 כי זה קרה לפני חודש. איך לכייל?","options":[{"t":"לקבל; הוא מכיר את המחסן","quality":0},{"t":"לשאול כמה אירועים כאלה היו בחמש השנים האחרונות אצלו ובענף, לבדוק מה הבקרות שנוספו מאז, ולדרג סבירות על בסיס זה ולא על בסיס הזיכרון הטרי","quality":3},{"t":"להוריד אותו אוטומטית כי הוא מוטה","quality":1},{"t":"לדרג לפי ממוצע של כל המרואיינים","quality":1}],"why":"הטיית הזמינות: אירוע טרי מרגיש סביר יותר. שיעור הבסיס (תדירות היסטורית + ענפית) הוא העוגן, והבקרות שנוספו מורידות את השיורי. ממוצע מרואיינים ממצע הטיות, לא מתקן אותן; «להוריד אוטומטית» היא הטיה בכיוון ההפוך."},{"q":"מודל ניטור AML מסמן 2% מהלקוחות. מתוך המסומנים, 5% הם באמת חשודים. לקוח סומן. מה ההסתברות שהוא באמת חשוד?","options":[{"t":"כ-95%; המערכת סימנה אותו","quality":0},{"t":"כ-5%; רוב ההתראות הן חיוביות-שגויות, ולכן תהליך הסגירה והתיעוד של התראות חשוב כמו הזיהוי","quality":3},{"t":"2%","quality":1},{"t":"50%: או שכן או שלא","quality":0}],"why":"ההסתברות שהתראה היא אמיתית ניתנת ישירות: 5% מהמסומנים. זה אומר ש-95% מהעבודה של קצין הציות היא לסגור התראות נכון ולתעד למה — ולכן ממצא על צבר התראות או על סגירות בלי נימוק חשוב יותר מממצא על «המערכת לא זיהתה»."},{"q":"בביקורות רכש ברשויות מקומיות קטנות, כמה מהן בדרך כלל מעלות ממצא על הפרדת תפקידים? (לפי דוחות מבקר המדינה ומשרד הפנים)","options":[{"t":"כמעט אף אחת; זה נדיר","quality":0},{"t":"רוב ניכר; לכן כשנכנסים למועצה קטנה מתכננים מראש בדיקת הפרדת תפקידים ובקרה מפצה, במקום להופתע","quality":3},{"t":"בדיוק חצי","quality":1},{"t":"זה תלוי בגזבר","quality":1}],"why":"שיעור הבסיס קובע את תוכנית העבודה: בעיה שמופיעה ברוב הגופים מסוגך היא נקודת מוצא לתכנון, לא ממצא מפתיע. דוחות מבקר המדינה על השלטון המקומי מעלים ממצאי הפרדת תפקידים ברשויות קטנות בעקביות — לכן «אנחנו מועצה קטנה» הוא סיבה לבדוק, לא פטור."},{"q":"אתם צריכים להעריך כמה שבועות ייקח תיק ביקורת רכש. התיק הקודם שלכם לקח 10 שבועות במקום 8 המתוכננים, וגם זה שלפניו. מה ההערכה הנכונה?","options":[{"t":"8 שבועות; הפעם אני {יודע| ":false,"sender":"system","title":"דוח מבקר המדינה על הרשויות המקומיות: הפרדת תפקידים וועדות מכרזים","text":"מבקר המדינה פרסם את דוח הביקורת על השלטון המקומי (דוח שנתי, פרק הרשויות המקומיות, מאי השנה). בין הממצאים: ב-23 רשויות קטנות הגזבר מכהן גם כחבר ועדת המכרזים וגם כמורשה חתימה יחיד; ב-17 רשויות ועדת הביקורת לא התכנסה בשנה האחרונה בניגוד לסעיף 170ג לפקודת העיריות; וב-11 רשויות ליקויים מדוחות קודמים לא תוקנו שלוש שנים ברציפות. בכל מועצה שתבקרו החודש, הגזבר כבר קרא את הכותרת — ושואל אם אתם «מבקר המדינה או יועצים».","effect":{"rep":1,"flag.news_comptroller_local":1},"requires":{"notFlags":["news_comptroller_local"]},"lesson":"municipalities-ordinance"},{"id":"news-market-goldstein-wins","bank":"event","journal":"none","type":"news","tier":[1,2],"weekRange":[5,30],"scoutable":false,"sender":"system","title":"מה אומרים בשוק: גולדשטיין–ברק זכתה במכרז הביקורת הפנימית של בנק גדול","text":"ידיעה באתר הכלכלי: גולדשטיין–ברק ושות׳ זכתה במכרז למיקור חוץ של הביקורת הפנימית באחד מחמשת הבנקים הגדולים, בהיקף של כ-40 אלף שעות בשנה. בכתבה מצוטט שותף: «הבנקים מחפשים מי שיודע לעמוד מול הפיקוח, לא מי שיודע לכתוב יפה.» בפינת הקפה במשרד תום אומר שהוא «שמע שהם מגייסים», ואורי אומר שמי שעובר לשם «עובד 44 שעות ומתעד 50». חלון ההצעות נפתח בתחילת כל עונה; ההסתברות להצעה תלויה במוניטין מול סף הפירמה.","effect":{"flag.news_goldstein_wins":1},"requires":{"notFlags":["news_goldstein_wins"]},"lesson":"sponsor-and-promotion"},{"id":"energy-illness","bank":"event","journal":"none","type":"incident","tier":[1,2],"weekRange":[6,44],"scoutable":false,"sender":"system","title":"שפעת. באמצע השבוע הכי עמוס","text":"39 חום, שלושה ימים במיטה, וטלפון שלא מפסיק. {manager} {manager:כותב|כותבת}: «{תבריא|תבריאי}. התיק לא בורח.» הלקוח כותב: «מתי אפשר לקבל את הטיוטה?» השבוע הזה האנרגיה נופלת, ומה שלא ייעשה עובר לשבוע הבא. החלטה שמקבלים עם חום ואנרגיה נמוכה היא החלטה שמחיר המידע בה כפול ומופיעה בה חלופת «קיצור דרך». אם אפשר — לא להחליט החלטות בלתי הפיכות השבוע.","effect":{"energy":-14,"eng.work":-1,"flag.ill_once"
