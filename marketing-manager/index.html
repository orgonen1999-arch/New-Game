grated Framework, 2013","aliases":["COSO"]},{"id":"iso-31000","he":"ISO 31000","source":"ISO 31000:2018 Risk management — Guidelines","aliases":["ISO 31000:2018"]},{"id":"internal-audit-law-1992","he":"חוק הביקורת הפנימית התשנ\"ב-1992","source":"ספר החוקים, חוק הביקורת הפנימית התשנ\"ב-1992","aliases":["חוק הביקורת הפנימית 1992","חוק הביקורת הפנימית"]},{"id":"municipalities-ordinance-170","he":"פקודת העיריות סעיפים 170א–170ג","source":"פקודת העיריות [נוסח חדש], סעיפים 170–170ג","aliases":["פקודת העיריות","פקודת העיריות (סעיפים 170א–170ג)"]},{"id":"interior-dg-circulars","he":"חוזרי מנכ\"ל משרד הפנים","source":"משרד הפנים, חוזרי המנהל הכללי לרשויות המקומיות","aliases":["חוזר מנכ\"ל משרד הפנים","חוזר מנכ\"ל"]},{"id":"govco-law-circulars","he":"חוק החברות הממשלתיות וחוזרי רשות החברות הממשלתיות","source":"חוק החברות הממשלתיות התשל\"ה-1975; רשות החברות הממשלתיות, חוזרים","aliases":["חוזרי רשות החברות הממשלתיות","חוק החברות הממשלתיות","רשות החברות הממשלתיות"]},{"id":"state-comptroller","he":"מבקר המדינה","source":"חוק מבקר המדינה [נוסח משולב] התשי\"ח-1958","aliases":["חוק מבקר המדינה"]},{"id":"pcbb-307","he":"הוראת ניהול בנקאי תקין 307","source":"בנק ישראל, הפיקוח על הבנקים, הוראה 307 — הביקורת הפנימית","aliases":["הוראה 307","307"]},{"id":"pcbb-308","he":"הוראת ניהול בנקאי תקין 308","source":"בנק ישראל, הפיקוח על הבנקים, הוראה 308 — ציות ואכיפה","aliases":["הוראה 308","308"]},{"id":"pcbb-310","he":"הוראת ניהול בנקאי תקין 310","source":"בנק ישראל, הפיקוח על הבנקים, הוראה 310 — ניהול סיכונים","aliases":["הוראה 310","310"]},{"id":"pcbb-350","he":"הוראת ניהול בנקאי תקין 350","source":"בנק ישראל, הפיקוח על הבנקים, הוראה 350 — ניהול סיכונים תפעוליים","aliases":["הוראה 350","350"]},{"id":"pcbb-361","he":"הוראת ניהול בנקאי תקין 361","source":"בנק ישראל, הפיקוח על הבנקים, הוראה 361 — ניהול הגנת הסייבר","aliases":["הוראה 361","361"]},{"id":"aml-law","he":"חוק איסור הלבנת הון התש\"ס-2000","source":"ספר החוקים, חוק איסור הלבנת הון התש\"ס-2000","aliases":["חוק איסור הלבנת הון"]},{"id":"aml-orders","he":"צווי איסור הלבנת הון","source":"צווי איסור הלבנת הון (חובות זיהוי, דיווח וניהול רישומים) לפי מגזר","aliases":["צו איסור הלבנת הון","צו איסור הלבנת הון (חובות זיהוי)","צו איסור הלבנת הון (חובות זיהוי, דיווח וניהול רישומים)"]},{"id":"privacy-amendment-13","he":"תיקון 13 לחוק הגנת הפרטיות","source":"חוק הגנת הפרטיות התשמ\"א-1981, תיקון מס' 13 (בתוקף מאוגוסט 2025)","aliases":["חוק הגנת הפרטיות","תיקון 13"]},{"id":"privacy-security-regs","he":"תקנות הגנת הפרטיות (אבטחת מידע) התשע\"ז-2017","source":"תקנות הגנת הפרטיות (אבטחת מידע) התשע\"ז-2017","aliases":["תקנות אבטחת מידע"]},{"id":"cma-circulars","he":"חוזרי רשות שוק ההון, ביטוח וחיסכון","source":"רשות שוק ההון, ביטוח וחיסכון, חוזרי גופים מוסדיים","aliases":["חוזרי רשות שוק ההון","רשות שוק ההון"]},{"id":"isox","he":"ISOX / SOX 404","source":"תקנות ניירות ערך (דוחות תקופתיים ומיידיים) — הערכת אפקטיביות הבקרה הפנימית על הדיווח הכספי והצהרות מנהלים","aliases":["ISOX","SOX 404","ISOX (SOX 404)"]},{"id":"external-auditor-reliance","he":"הסתמכות רואה החשבון המבקר על עבודת הביקורת הפנימית","source":"ISA 610 (Revised 2013), Using the Work of Internal Auditors","aliases":["ISA 610","הסתמכות רואה החשבון המבקר"]},{"id":"risk-survey-method","he":"מתודולוגיית סקר סיכונים (סבירות × השפעה)","source":"ISO 31000:2018; COSO ERM 2017; נוהג מקצועי מקובל בסקרי סיכונים בישראל","aliases":["סקר סיכונים","סבירות × השפעה"]},{"id":"gifts-law","he":"חוק שירות הציבור (מתנות) התש\"ם-1979","source":"חוק שירות הציבור (מתנות) התש\"ם-1979; הנחיות נציבות שירות המדינה","aliases":["חוק שירות הציבור (מתנות)","כללי מתנות"]},{"id":"whistleblower-law","he":"חוק הגנה על עובדים (חשיפת עבירות ופגיעה בטוהר המידות או במינהל התקין) התשנ\"ז-1997","source":"ספר החוקים; נציב תלונות הציבור במשרד מבקר המדינה","aliases":["חוק הגנה על עובדים (חשיפת עבירות)","חשיפת שחיתויות"]},{"id":"decision-process","he":"תהליך קבלת החלטות (מסגור · מידע · חלופות · פרה-מורטם · ממו)","source":"Klein, Performing a Project Premortem (HBR 2007); Kahneman, Thinking, Fast and Slow (2011)","aliases":["קבלת החלטות","פרה-מורטם"]}],"lessons":[{"id":"three-lines","title":"מודל שלושת הקווים","tier":1,"frameworks":["three-lines","pcbb-310","gias-2024"],"skills":["controls","reg","escalation"],"body":"מודל שלושת הקווים של ה-IIA (2020) מחלק את האחריות על סיכונים בארגון לפי תפקיד, לא לפי מחלקה. הקו הראשון הוא ההנהלה התפעולית: היא הבעלים של הסיכון ושל הבקרה היומיומית. הקו השני מייעץ, מנטר ומאתגר: ציות, ניהול סיכונים, כתיבת מדיניות ונהלים. הקו השלישי הוא הביקורת הפנימית, שנותנת ביטחון עצמאי לדירקטוריון ולוועדת הביקורת ואינה חלק מההנהלה. הגרסה של 2020 החליפה את «קווי ההגנה» ב«קווים» כדי להדגיש שיתוף פעולה ולא חומות. בבנקים הוראה 310 מאמצת את אותה חלוקה. למה זה חשוב לכם: פירמה שכתבה נוהל ללקוח עשתה עבודת קו שני; אם היא מבקרת את אותו נוהל, היא בודקת את עצמה. לכן כל תיק במשחק נושא תווית קו 2 או קו 3, והמנוע זוכר."},{"id":"independence-objectivity","title":"עצמאות ואובייקטיביות","tier":1,"frameworks":["gias-2024","pcbb-307","internal-audit-law-1992"],"skills":["evidence","reg","escalation"],"body":"עצמאות היא מצב ארגוני: הביקורת הפנימית מדווחת לדירקטוריון או לוועדת הביקורת, לא למי שהיא בודקת. אובייקטיביות היא מצב נפשי: שיקול דעת בלי פשרות. תקני GIAS 2024 מקדישים לכך את תקנים 2.1 עד 2.3 (בעבר סדרת 1100 של ה-IPPF): אובייקטיביות אישית, שמירה עליה, וגילוי של כל פגיעה בה. הוראה 307 דורשת שהמבקר הפנימי הראשי בבנק יתמנה על ידי הדירקטוריון, יהיה חופשי מתפקידים תפעוליים ויקבל גישה לכל מידע. חוק הביקורת הפנימית קובע שהמבקר לא ימלא תפקיד נוסף שעלול ליצור ניגוד עניינים. הכלל המעשי: כשמשהו פוגע באובייקטיביות שלכם, הצעד הראשון הוא גילוי, לא התעלמות. גילוי מוקדם הוא זול; גילוי שהרגולטור כופה הוא יקר."},{"id":"self-review-independence","title":"ביקורת על נוהל שהפירמה כתבה","tier":1,"frameworks":["gias-2024","three-lines","pcbb-307","internal-audit-law-1992"],"skills":["reg","escalation","client"],"body":"איום הסקירה העצמית נוצר כשהגוף המבקר בודק עבודה שהוא עצמו ביצע. GIAS 2024 (תקן 2.2) קובע שמבקר פנימי לא יעריך פעילות שהיה אחראי לה בשנה האחרונה, ותקן 2.3 דורש לגלות כל פגיעה באובייקטיביות למי שמקבל את הדוח. במיקור חוץ זה קורה בשקט: הפירמה כתבה ללקוח נוהל רכש (קו 2), ושנה אחר כך תוכנית הביקורת כוללת את תהליך הרכש (קו 3). ארבע תשובות אפשריות: לגלות לשותף ולוועדת הביקורת של הלקוח ולתת להם להחליט; לסרב לחלק הזה; לגדר אותו עם צוות אחר; או לשתוק. רק הראשונות שלוש לגיטימיות, והשתיקה היא זו שפוגעת ביושרה. במשחק המנוע מסמן תיק כזה כ«סקירה עצמית», ושאלת הרגולטור «מי כתב את הנוהל?» היא השלכה שמחכה."},{"id":"internal-audit-law-1992","title":"חוק הביקורת הפנימית התשנ\"ב-1992","tier":1,"frameworks":["internal-audit-law-1992","state-comptroller"],"skills":["reg","writing"],"body":"חוק הביקורת הפנימית חל על גופים ציבוריים: משרדי ממשלה, חברות ממשלתיות, תאגידים סטטוטוריים ועוד, ודרכו גם על גופים שחוקים אחרים מפנים אליו. כל גוף כזה חייב במבקר פנימי. המבקר בודק אם פעולות הגוף תקינות מבחינת שמירת החוק, הניהול התקין, טוהר המידות, החיסכון והיעילות, ואם הן מועילות להשגת היעדים. החוק מעגן את עצמאותו: הוא ממונה בהליך שנקבע בחוק, לא ניתן להפסיק את כהונתו בלי הליך מסודר, ויש לו גישה לכל מסמך ומידע. המבקר מגיש תוכנית עבודה שנתית ודוחות לראש הגוף ולוועדת הביקורת, והנהלה שלא מתקנת ליקוי צריכה להסביר למה. מבקר המדינה בודק את אותם גופים מבחוץ וקורא את דוחות הביקורת הפנימית. למבקר חיצוני במיקור חוץ: החוק הוא הקריטריון, לא רק נוהל הלקוח."},{"id":"municipalities-ordinance","title":"פקודת העיריות: מבקר העירייה (170א–170ג)","tier":1,"frameworks":["municipalities-ordinance-170","interior-dg-circulars","internal-audit-law-1992"],"skills":["reg","writing","client"],"body":"ברשויות המקומיות הביקורת הפנימית מוסדרת בפקודת העיריות, ודין דומה חל על מועצות מקומיות ואזוריות מכוח צווי המועצות. סעיף 170א מגדיר את תפקידי מבקר העירייה: לבדוק אם פעולות העירייה, ובכלל זה פעולות של עובדיה ושל גופים עירוניים, נעשו כדין, בידי המוסמך לכך, תוך שמירה על טוהר המידות ועקרונות היעילות והחיסכון; לבדוק את ניהול החשבונות ואת שמירת הרכוש; ולבדוק שהחלטות המועצה מבוצעות. סעיף 170ב מחייב את ראש העירייה ועובדיה למסור למבקר כל מסמך ומידע. סעיף 170ג קובע את מסלול הדוח: המבקר מגיש דוח שנתי לראש העירייה ולוועדת הביקורת, ראש העירייה מגיש הערות, הוועדה דנה ומגישה סיכום למועצה, והמועצה דנה. הדוח אינו מתפרסם לפני הדיון במועצה. מבקר העירייה הוא קו שלישי; גזבר שאומר «אנחנו מועצה קטנה» הוא קו ראשון."},{"id":"interior-dg-circulars","title":"חוזרי מנכ\"ל משרד הפנים","tier":1,"frameworks":["interior-dg-circulars","municipalities-ordinance-170"],"skills":["reg","evidence"],"body":"משרד הפנים מנחה את הרשויות המקומיות באמצעות חוזרי המנהל הכללי, והם קריטריון ביקורת מחייב לצד הפקודה ותקנות העיריות. חוזרים מרכזיים מסדירים את נוהל התמיכות במוסדות ציבור (קריטריונים שוויוניים, ועדת תמיכות, פרסום), הקצאת מקרקעין, ניגוד עניינים של נבחרים ועובדים, העסקת יועצים, ותהליכי רכש והתקשרויות שמשלימים את תקנות העיריות (מכרזים). כשאתם כותבים ממצא ברשות מקומית, הקריטריון חייב להיות מדויק: לא «נוהג מקובל» אלא סעיף בתקנות או חוזר מנכ\"ל ממוספר ומתוארך. גזבר יגיד שהחוזר ישן; בדקו אם הוא עודכן, והביאו את הנוסח העדכני. ממצא ציבורי בלי קריטריון כתוב לא שורד את ועדת הביקורת, ובוודאי לא את מבקר המדינה."},{"id":"govco-authority-circulars","title":"חברות ממשלתיות: החוק וחוזרי הרשות","tier":1,"frameworks":["govco-law-circulars","internal-audit-law-1992","state-comptroller"],"skills":["reg","present"],"body":"חוק החברות הממשלתיות התשל\"ה-1975 מסדיר את הממשל התאגידי של החברות שבבעלות המדינה: מינוי דירקטורים, ועדת ביקורת של הדירקטוריון, מבקר פנימי, ודיווח לרשות החברות הממשלתיות. חוק הביקורת הפנימית חל על החברות הללו כגופים ציבוריים, ומבקר המדינה מבקר אותן כגופים מבוקרים. רשות החברות הממשלתיות מפרסמת חוזרים שמחייבים את החברות בנושאים כמו תוכנית עבודה של הביקורת הפנימית, ניהול סיכונים, דיווח על אירועים חריגים, מתנות ואירוח, ניגוד עניינים, והתקשרויות. ממצא בחברה ממשלתית מצטט שלוש שכבות: החוק, חוזר הרשות, ונוהל החברה. ועדת הביקורת של חברה ממשלתית קוראת גם את הדוח של השנה שעברה, ולכן ממצא חוזר שלא טופל הוא בעצמו ממצא: על מעקב ההנהלה."},{"id":"state-comptroller","title":"מבקר המדינה והביקורת הציבורית","tier":2,"frameworks":["state-comptroller","internal-audit-law-1992"],"skills":["reg","writing","evidence"],"body":"מבקר המדינה מבקר מכוח חוק מבקר המדינה את משרדי הממשלה, הרשויות המקומיות, החברות הממשלתיות, התאגידים הסטטוטוריים וגופים נתמכים. אמות המידה שלו הן חוקיות, סדירות, יעילות, חיסכון וטוהר המידות, אותן אמות מידה שחוק הביקורת הפנימית מטיל על המבקר הפנימי. דוחות מבקר המדינה מתפרסמים, נדונים בוועדה לענייני ביקורת המדינה בכנסת, ומחייבים את הגוף המבוקר להגיש תיקון ליקויים. למי שעובד במיקור חוץ של ביקורת פנימית זה אומר שני דברים: הדוח שלכם עלול להיקרא על ידי מבקר המדינה, ולכן כל ממצא צריך ראיה שעומדת בפני עצמה; וליקוי שמבקר המדינה כבר כתב ולא תוקן הוא נקודת פתיחה חובה לתוכנית הביקורת. גם נציב תלונות הציבור, שבמשרד המבקר, מגן על חושפי שחיתויות במגזר הציבורי."},{"id":"directive-307","title":"הוראה 307: הביקורת הפנימית בתאגיד בנקאי","tier":1,"frameworks":["pcbb-307","gias-2024","internal-audit-law-1992"],"skills":["reg","controls"],"body":"הוראת ניהול בנקאי תקין 307 של הפיקוח על הבנקים קובעת את מעמדה של הביקורת הפנימית בתאגיד בנקאי. הדירקטוריון ממנה את המבקר הפנימי הראשי, מאשר את כתב המינוי ואת תוכנית העבודה, ומקבל ממנו דיווח ישיר דרך ועדת הביקורת. ההוראה דורשת עצמאות מהקווים העסקיים, סמכות גישה בלתי מוגבלת למידע ולאנשים, תוכנית ביקורת רב-שנתית מבוססת סיכון שמכסה את כל פעילות הבנק, ועמידה בתקנים המקצועיים המקובלים, כלומר תקני ה-IIA וחוק הביקורת הפנימית. היא מגבילה מיקור חוץ של פעילות הביקורת ודורשת שהאחריות תישאר בבנק. למי שמגיע כקבלן חיצוני: הבנק אחראי, אתם מסייעים, והדוח שלכם נכנס למערכת מעקב שהרגולטור קורא. ממצא שהורד בדירוג בלי נימוק מתועד הוא בדיוק מה שהפיקוח מחפש בביקורת שלו על הביקורת."},{"id":"directive-308","title":"הוראה 308: ציות וקצין הציות","tier":1,"frameworks":["pcbb-308","aml-orders"],"skills":["reg","controls","client"],"body":"הוראה 308 מטילה על הדירקטוריון וההנהלה של תאגיד בנקאי אחריות לניהול סיכון הציות: הסיכון לסנקציות, להפסד או לפגיעה במוניטין בשל אי-עמידה בחוקים, בהוראות ובכללי התנהגות. ההוראה מחייבת פונקציית ציות עצמאית בראשות קצין ציות, שאינו כפוף לקווים העסקיים, עם גישה לכל מידע ודיווח ישיר להנהלה ולדירקטוריון. קצין הציות מבצע סקר סיכוני ציות, מנהל תוכנית אכיפה, מטפל בחריגות ומגיש דוח שנתי. ציות הוא קו שני: הוא מייעץ ומנטר, אבל הבעלים של ההתנהגות נשארים הקווים העסקיים. כשקצין ציות «מכין לכם מדגם», הוא עושה לכם טובה שפוגעת בראיה: הביקורת (קו שלישי) בוחרת בעצמה. יחסים טובים עם קצין הציות חשובים, ובכל זאת המתודולוגיה שלכם לא עוברת דרך המייל החביב שלו."},{"id":"directive-310","title":"הוראה 310: ניהול סיכונים","tier":2,"frameworks":["pcbb-310","three-lines","iso-31000"],"skills":["risk","reg"],"body":"הוראה 310 קובעת את מסגרת ניהול הסיכונים בתאגיד בנקאי. הדירקטוריון מאשר מסמך תיאבון סיכון, מדיניות לכל סיכון מהותי ומסגרת ממשל שמבוססת על שלושה קווים: הקווים העסקיים כבעלי הסיכון, פונקציית ניהול סיכונים עצמאית בראשות מנהל הסיכונים הראשי (CRO) לצד הציות כקו שני, והביקורת הפנימית כקו שלישי. ההוראה דורשת זיהוי, מדידה, ניטור ודיווח של הסיכונים, מערכת בקרה פנימית, ותהליך הערכה פנימי של הלימות ההון. ל-CRO יש גישה ישירה לדירקטוריון והוא לא יכול להיות אחראי על פעילות עסקית. כשאתם בונים סקר סיכונים לבנק, תיאבון הסיכון שהדירקטוריון אישר הוא קו הייחוס: סיכון שיורי מעל התיאבון הוא ממצא, גם אם המנהל אומר ש«ככה תמיד היה»."},{"id":"directive-350","title":"הוראה 350: סיכון תפעולי","tier":2,"frameworks":["pcbb-350","pcbb-310","risk-survey-method"],"skills":["risk","controls"],"body":"הוראה 350 מאמצת את הגדרת באזל לסיכון תפעולי: סיכון להפסד כתוצאה מכשל או אי-התאמה של תהליכים פנימיים, אנשים ומערכות, או מאירועים חיצוניים, כולל סיכון משפטי. ההוראה דורשת מסגרת ניהול: מדיניות שאושרה בדירקטוריון, מיפוי תהליכים, הערכה עצמית של סיכונים ובקרות (RCSA), מדדי סיכון מרכזיים (KRI), איסוף נתוני אירועי הפסד וכמעט-הפסד, הערכת סיכון בכל מוצר או תהליך חדש, ודיווח תקופתי להנהלה ולדירקטוריון. סדנת RCSA היא המקום שבו הקו הראשון מדרג את עצמו, ולכן ביקורת או סקר סיכונים צריכים לאתגר אותה: בעל תהליך נוטה לדרג את הבקרה שלו כ«אפקטיבית» בלי ראיה. נתוני אירועים הם שיעור הבסיס שלכם: תהליך עם שלושה אירועי הפסד בשנה לא מקבל «סבירות נמוכה» רק כי התיקון כבר «בדרך»."},{"id":"directive-361","title":"הוראה 361: ניהול הגנת הסייבר","tier":2,"frameworks":["pcbb-361","pcbb-350"],"skills":["risk","reg","controls"],"body":"הוראה 361 קובעת את אחריות הדירקטוריון וההנהלה של תאגיד בנקאי להגנת הסייבר: אסטרטגיה ומדיניות שאושרו בדירקטוריון, מינוי מנהל הגנת סייבר, הערכת סיכוני סייבר תקופתית, תוכנית עבודה, ניהול אירועים ודיווח לפיקוח על הבנקים על אירוע סייבר מהותי. ההוראה מתייחסת גם לספקים ולשרשרת האספקה: הבנק אחראי לסיכון שספק מייבא. ברמת אנליסט אתם לא בודקים חומת אש; אתם בודקים ממשל: האם יש מיפוי נכסים, האם ממצאי מבדקי חדירה מטופלים לפי לוח זמנים, האם ניהול ההרשאות מתועד, האם סקר הסיכונים מעודכן אחרי שינוי מהותי, והאם ההנהלה קיבלה דיווח. ממצא סייבר טוב הוא ממצא על תהליך, עם ראיה שאפשר להראות לדירקטוריון בלי להסביר פרוטוקולים. כששואלים «מה הסיכון?», התשובה היא בשפה של השפעה עסקית, לא של טכנולוגיה."},{"id":"aml-kyc-orders","title":"צווי איסור הלבנת הון: הכר את הלקוח","tier":1,"frameworks":["aml-law","aml-orders","pcbb-308"],"skills":["reg","testing","evidence"],"body":"חוק איסור הלבנת הון התש\"ס-2000 הוא המסגרת, והצווים לפי מגזר (בנקים, חברות ביטוח, קופות גמל, נותני שירותים פיננסיים ועוד) הם החובות המעשיות. שלוש משפחות חובות: זיהוי והכרת הלקוח, כולל הצהרת נהנה ובעל שליטה, אימות פרטים ועדכון תקופתי לפי רמת סיכון; ניהול רישומים ושמירתם לתקופה שנקבעה; ודיווח לרשות לאיסור הלבנת הון, גם דיווחים אוטומטיים לפי סף וגם דיווחים על פעולות בלתי רגילות. הגישה היא מבוססת סיכון: לקוח בסיכון גבוה מקבל בדיקת נאותות מוגברת ועדכון תכוף יותר. לכן מדגם ביקורת על תהליך הכר את הלקוח מתחיל מהאוכלוסייה המסווגת לפי סיכון, ורוב הפריטים מגיעים מהשכבה הגבוהה. חמישה-עשר תיקים «מסודרים» מסיכון נמוך שהלקוח שלח הם לא מדגם; הם מצגת."},{"id":"aml-tipping-off","title":"פיצול, דיווח בלתי רגיל ואיסור הדלפה","tier":2,"frameworks":["aml-law","aml-orders"],"skills":["reg","escalation","judgment"],"body":"חוק איסור הלבנת הון קובע עבירה עצמאית על מי שעושה פעולה ברכוש במטרה שלא יהיה דיווח, או כדי לגרום לדיווח לא נכון. פיצול הפקדה גדולה לכמה הפקדות מתחת לסף הדיווח (structuring) הוא בדיוק זה, ולכן אחת-עשרה הפקדות של 49 אלף הן דפוס שמחייב בדיקה, לא צירוף מקרים. החובה של המוסד היא לדווח לרשות לאיסור הלבנת הון על פעולה בלתי רגילה; ההחלטה אם זו עבירה היא של הרשויות. לצד זה עומד איסור הדלפה: אסור לגלות ללקוח או לכל אדם שנעשה דיווח או שמתנהלת בדיקה. מבקר שמתקשר ללקוח «לשאול מה זה» כדי לחסוך זמן עשוי להפר את האיסור ולחשוף את המוסד. הנתיב הנכון הוא פנימי: לתעד, לעדכן את קצין הציות או האחראי לדיווח, ולהשאיר את הלקוח מחוץ לשיחה."},{"id":"privacy-amendment-13","title":"תיקון 13 לחוק הגנת הפרטיות","tier":1,"frameworks":["privacy-amendment-13","privacy-security-regs"],"skills":["reg","risk","escalation"],"body":"תיקון 13 לחוק הגנת הפרטיות, שנכנס לתוקף באוגוסט 2025, הוא השינוי הגדול ביותר בחוק מאז חקיקתו. הוא מעדכן הגדרות (מידע אישי, מידע בעל רגישות מיוחדת, בעל שליטה במאגר ומחזיק), מצמצם את חובת רישום המאגרים ומחליף אותה בחובת דיווח למאגרים גדולים או רגישים, מחייב מינוי ממונה על הגנת הפרטיות בגופים ציבוריים ובארגונים שמעבדים מידע בהיקף או ברגישות גבוהים, ומעניק לרשות להגנת הפרטיות סמכויות אכיפה מנהליות משמעותיות, כולל עיצומים כספיים גבוהים. תקנות אבטחת מידע (2017) ממשיכות לחול ודורשות, במאגרים ברמת אבטחה גבוהה, דיווח לרשות על אירוע אבטחה חמור. קובץ שנשלח לכתובת הלא נכונה הוא אירוע כזה בפוטנציה: השאלה הראשונה היא מה היה בקובץ ומי קיבל אותו, לא מי שלח. הזמן הוא גורם: תיעוד מיידי, הערכת חומרה, והחלטה מתועדת על דיווח."},{"id":"capital-market-circulars","title":"חוזרי רשות שוק ההון לגופים מוסדיים","tier":2,"frameworks":["cma-circulars","three-lines"],"skills":["reg","controls"],"body":"חברות ביטוח, קופות גמל וקרנות פנסיה הן גופים מוסדיים בפיקוח רשות שוק ההון, ביטוח וחיסכון. הרשות מסדירה אותם בחוזרים שמקבילים במבנה להוראות בנק ישראל: חוזר על הביקורת הפנימית בגופים מוסדיים (מינוי, עצמאות, תוכנית עבודה וקשר לוועדת הביקורת), חוזר ניהול סיכונים (מנהל סיכונים, מסמך מדיניות, דיווח לדירקטוריון), חוזר מיקור חוץ (אחריות הגוף על ספק, בדיקת נאותות, זכות ביקורת), חוזרי אבטחת מידע וסייבר, וחוזרים על ציות ואכיפה פנימית. בקופת גמל ועדת הביקורת היא כתובת חזקה, ויו\"ר שהיא רואת חשבון תקרא כל דירוג. כשמבקשים מכם «רק להוריד את זה לליקוי», הקריטריון הוא החוזר הרלוונטי ונוהל הגוף: אם הבקרה שנכשלה היא בקרת מפתח על נכסי עמיתים, הדירוג נקבע לפי ההשפעה, לא לפי השיחה."},{"id":"isox-scoping","title":"ISOX: קביעת היקף מלמעלה למטה","tier":1,"frameworks":["isox","coso-2013"],"skills":["controls","risk","prio"],"body":"ISOX הוא האימוץ הישראלי של סעיף 404 ל-SOX: תקנות ניירות ערך מחייבות תאגיד מדווח לצרף לדוח התקופתי הערכה של ההנהלה על אפקטיביות הבקרה הפנימית על הדיווח הכספי ועל הגילוי, והצהרות של המנכ\"ל ונושא המשרה הבכיר בתחום הכספים. בניגוד ל-SOX האמריקאי, רואה החשבון המבקר אינו נדרש בדרך כלל לחוות דעת נפרדת על הבקרה. ההיקף נקבע מלמעלה למטה: מהדוחות הכספיים לסעיפים מהותיים, מהם לתהליכים מהותיים, ובתוכם לבקרות מפתח. בישראל תהליך הסגירה והדיווח הכספי ובקרות המחשוב הכלליות (ITGC) נכללים תמיד, ואליהם מצטרפים תהליכים עסקיים מהותיים כמו תשלומים, הכנסות ושכר. בקרת מפתח היא זו שבלעדיה הצגה מוטעית מהותית לא תימנע או תתגלה. בדיקת יתר של בקרות משניות שורפת שעות ולא מוסיפה ביטחון."},{"id":"isox-rollforward","title":"עדכון לסוף שנה (roll-forward)","tier":1,"frameworks":["isox","coso-2013"],"skills":["testing","controls","prio"],"body":"בדיקות ISOX נעשות ברובן באמצע השנה, אבל הערכת ההנהלה מתייחסת למועד הדוח, סוף השנה. עדכון לסוף שנה הוא ההליך שמגשר על הפער: לכל בקרת מפתח שנבדקה במועד ביניים מחליטים אילו ראיות נוספות נדרשות לתקופה שנותרה. השיקולים: אורך התקופה שנותרה, תוצאות הבדיקה הראשונה, האם הבקרה או מבצעה השתנו, רמת הסיכון של הבקרה, והאם מדובר בבקרה ידנית או אוטומטית בסביבת ITGC יציבה. בקרה אוטומטית שלא השתנתה עשויה להסתפק בבירור ובראיה על יציבות השינויים; בקרה ידנית יומית תקבל מדגם קטן נוסף. ממצא שהתגלה במועד הביניים ותוקן חייב בדיקה חוזרת של הבקרה המתוקנת לפרק זמן מספיק לפני סוף השנה. «בדקנו ביולי» אינה ראיה לדצמבר, ו«לא השתנה כלום» היא טענה שצריך לאמת, לא להניח."},{"id":"management-certification","title":"הצהרת הנהלה על הבקרה הפנימית","tier":2,"frameworks":["isox"],"skills":["writing","present","escalation"],"body":"בתום הערכת ISOX המנכ\"ל ונושא המשרה הבכיר בתחום הכספים חותמים על הצהרות שמצורפות לדוח התקופתי. הם מצהירים שבדקו את הדוח, שלמיטב ידיעתם אין בו מצג מטעה, שהם אחראים לבקרה הפנימית, שהעריכו את אפקטיביותה, ושהביאו לידיעת רואה החשבון המבקר וועדת הביקורת כל ליקוי משמעותי וחולשה מהותית, וכל תרמית שמעורבים בה מנהלים או עובדים בתפקידי בקרה. ההצהרה מסתמכת על מסקנות הבדיקה שלכם: אם כתבתם «אפקטיבי» על בקרה שבדקתם בחיפזון, השם של המנכ\"ל עומד על זה. לכן מסקנת בקרה היא מסמך משפטי קטן: היא נשענת על נייר עבודה שמתאר אוכלוסייה, מדגם, חריגות והערכה. ליקוי שהתגלה אחרי החתימה מחייב בירור אם היה ניתן לגילוי קודם, וזה בדיוק הרגע שבו בודקים מי כתב «ללא חריגות» ועל סמך מה."},{"id":"external-auditor-reliance","title":"הסתמכות רואה החשבון המבקר","tier":1,"frameworks":["external-auditor-reliance","isox","gias-2024"],"skills":["testing","evidence","present"],"body":"רואה החשבון המבקר של החברה רשאי להסתמך על עבודת הביקורת הפנימית, כולל עבודה שעשתה פירמה חיצונית בשמה, לפי תקן ISA 610 (המאומץ בישראל) ובהתאם לכללי הפיקוח על רואי חשבון. לפני שהוא מסתמך הוא מעריך שלושה דברים: אובייקטיביות הפונקציה, כשירות הצוות, וגישה שיטתית וממושמעת, כלומר מתודולוגיה כתובה ובקרת איכות. אחר כך הוא בוחן את העבודה עצמה: האם היקף המדגם נקבע על בסיס מתועד, האם נייר העבודה מאפשר שחזור, והאם המסקנות נתמכות. הוא יבצע בעצמו חלק מהבדיקות כדי לאמת. כשרואה החשבון שואל «על סמך מה נקבע גודל המדגם?», התשובה הטובה היא טיעון: תדירות הבקרה, שיעור חריגה נסבל, שיעור צפוי, רמת ביטחון, והטבלה שבה השתמשתם. «ככה תמיד עשינו» פירושו שהוא לא יסתמך, ושהשעות שלכם לא ייספרו."},{"id":"gias-2024","title":"תקני GIAS 2024","tier":1,"frameworks":["gias-2024"],"skills":["evidence","writing","reg"],"body":"תקני הביקורת הפנימית הגלובליים (GIAS) פורסמו בינואר 2024 ונכנסו לתוקף בינואר 2025, והחליפו את ה-IPPF הקודם. הם בנויים מחמישה תחומים: מטרת הביקורת הפנימית; אתיקה ומקצועיות (יושרה, אובייקטיביות, כשירות, זהירות מקצועית וספקנות, סודיות); ממשל הפונקציה מול הדירקטוריון; ניהול הפונקציה (תוכנית מבוססת סיכון, משאבים, איכות); וביצוע שירותי ביקורת: תכנון ההתקשרות, ביצוע העבודה, ותקשורת התוצאות. תקן 14.1 דורש מידע רלוונטי, מהימן ומספיק כבסיס למסקנות; תקן 14.2 מגדיר ממצא דרך קריטריון, מצב, סיבה והשפעה; תקן 14.4 עוסק בהמלצות ובתוכניות פעולה; תקן 15.2 מחייב לאמת את יישום התיקונים. התקנים חלים על פירמה שמבצעת ביקורת פנימית במיקור חוץ, והוראה 307 וחוק הביקורת הפנימית מפנים ל«תקנים מקצועיים מקובלים», כלומר אליהם."},{"id":"coso-2013","title":"COSO 2013: חמישה רכיבים, 17 עקרונות","tier":1,"frameworks":["coso-2013","isox"],"skills":["controls","risk"],"body":"מסגרת COSO 2013 היא השפה המשותפת של בקרה פנימית, והבסיס להערכת ISOX. בקרה פנימית מוגדרת כתהליך, שמבצעים הדירקטוריון, ההנהלה והעובדים, שנועד לספק ביטחון סביר להשגת יעדים בתפעול, בדיווח ובציות. חמישה רכיבים: סביבת בקרה (הטון מלמעלה, מבנה, כשירות, אחריותיות); הערכת סיכונים (יעדים, זיהוי, סיכון תרמית, שינויים); פעולות בקרה (בחירה ופיתוח, בקרות טכנולוגיה, מדיניות ונהלים); מידע ותקשורת; ופעילויות ניטור. 17 עקרונות מפרטים את הרכיבים, ומערכת בקרה אפקטיבית דורשת שכל רכיב ועיקרון יהיו קיימים ופועלים ושהרכיבים יפעלו יחד. ברמת אנליסט COSO הוא רשימת תיוג לסקירת סביבת בקרה: כשאין מדיניות כתובה, כשאין מי שאחראי, או כשאף אחד לא מנטר, הליקוי הוא ברכיב, לא בבקרה הבודדת."},{"id":"iso-31000","title":"ISO 31000: עקרונות, מסגרת ותהליך","tier":1,"frameworks":["iso-31000","risk-survey-method"],"skills":["risk","framing"],"body":"ISO 31000:2018 מגדיר סיכון כ«השפעה של אי-ודאות על יעדים», ומכאן שאין סיכון בלי יעד: סקר סיכונים מתחיל מהיעדים של הארגון, לא מרשימת צרות. התקן בנוי משלוש שכבות: עקרונות (יצירת ערך, משולב, מותאם, מכליל, דינמי, מבוסס מידע, אנושי ומשתפר); מסגרת (מנהיגות ומחויבות, שילוב, תכנון, יישום, הערכה ושיפור); ותהליך: קביעת היקף, הקשר וקריטריונים; הערכת סיכונים שמורכבת מזיהוי, ניתוח והערכה; טיפול בסיכון; ניטור וסקירה; תיעוד ודיווח; ולאורך כולם תקשורת והיוועצות. ההבחנה בין ניתוח (כמה גדול) להערכה (האם זה מקובל ביחס לקריטריונים) היא זו שמפרידה בין טבלה למסקנה. בסקר סיכונים ללקוח ממשלתי או בנקאי התקן הוא השלד; הוראה 310 או חוזר הרשות הם הקריטריון המחייב."},{"id":"inherent-residual","title":"סיכון מובנה מול סיכון שיורי","tier":1,"frameworks":["risk-survey-method","iso-31000","pcbb-310"],"skills":["risk","judgment"],"body":"סיכון מובנה הוא הסיכון לפני שמביאים בחשבון בקרות: סבירות כפול השפעה כאילו אין שום מנגנון. סיכון שיורי הוא מה שנותר אחרי שהבקרות הקיימות פועלות כפי שהן פועלות בפועל, לא כפי שהן כתובות. ההפרש ביניהם הוא אפקטיביות הבקרה, ולכן הוא הטיעון המרכזי בדוח סקר סיכונים: סיכון שיורי שקרוב מדי למובנה אומר שהבקרות לא עובדות; סיכון שיורי מעל תיאבון הסיכון של הדירקטוריון מחייב טיפול. שלושה כללים: שיורי לעולם לא גבוה ממובנה; הורדת השיורי דורשת ראיה שהבקרה אפקטיבית, לא הצהרה של בעל התהליך; ומפת החום מציגה את שניהם, כזוג, כדי שההנהלה תראה מה הבקרות קונות לה. סולם 1 עד 5 לסבירות ולהשפעה חייב הגדרות כתובות (כסף, זמן, רגולציה, מוניטין), אחרת כל משתתף בסדנה מדרג בשפה פרטית."},{"id":"design-vs-operating","title":"אפקטיביות תכנון מול אפקטיביות תפעול","tier":1,"frameworks":["coso-2013","isox","gias-2024"],"skills":["controls","testing"],"body":"שתי שאלות שונות על כל בקרה. אפקטיביות התכנון: אם הבקרה תפעל בדיוק כפי שתוכננה, האם היא תמנע או תגלה את הסיכון במועד? בודקים אותה בהליכה מודרכת (walkthrough) ובבחינת מקרה אחד, ומסתכלים על מי מבצע, באיזו תדירות, על מה, ומה קורה כשנמצאת חריגה. אפקטיביות התפעול: האם הבקרה בוצעה בעקביות, לאורך התקופה, על ידי אדם כשיר ובזמן? אותה בודקים במדגם. הסדר חשוב: בקרה עם ליקוי תכנון לא נבדקת תפעולית, כי גם ביצוע מושלם שלה לא יכסה את הסיכון. ליקוי תפעול מתקנים באכיפה והדרכה; ליקוי תכנון מתקנים בשינוי הבקרה. בסקירת בקרות הסולם הוא בדיוק זה: הערה, ליקוי תפעול, ליקוי תכנון. אישור חתום על טופס שאף אחד לא קורא הוא בקרה שמתוכננת להיראות, לא לעבוד."},{"id":"deficiency-taxonomy","title":"ליקוי, ליקוי משמעותי, חולשה מהותית","tier":1,"frameworks":["isox","coso-2013"],"skills":["controls","judgment","writing"],"body":"הטקסונומיה הזו שייכת לעולם הבקרה על הדיווח הכספי (ISOX) ואין להשתמש בה בביקורת ציות או ברשות מקומית. ליקוי קיים כשתכנון או תפעול של בקרה אינם מאפשרים למנוע או לגלות הצגה מוטעית במועד. חולשה מהותית היא ליקוי, או צירוף ליקויים, שיש אפשרות סבירה שבגללם הצגה מוטעית מהותית בדוחות לא תימנע או לא תתגלה במועד. ליקוי משמעותי הוא פחות חמור מחולשה מהותית, אך מספיק חשוב כדי להביאו לידיעת האחראים על הפיקוח על הדיווח הכספי. ההערכה נעשית לפי שני צירים: סבירות (לא רק האם קרה, אלא האם יכול לקרות) ועוצמה (סכום ההצגה המוטעית הפוטנציאלית), ובהתחשב בבקרות מפצות ובצבירת ליקויים באותו תהליך. חריגה אחת בבקרת אישור תשלומים היא ליקוי; האם היא משמעותית תלוי במה הבקרה שומרת ומה עוד עומד מאחוריה."},{"id":"sampling-population","title":"המדגם מתחיל מהאוכלוסייה","tier":1,"frameworks":["gias-2024","pcbb-308","aml-orders"],"skills":["testing","evidence","gather"],"body":"לפני שבוחרים פריט אחד, שלוש שאלות: מהי האוכלוסייה שהבקרה אמורה לכסות, האם הרשימה שקיבלתם שלמה, ומי בחר את הפריטים. GIAS 2024 (תקן 14.1) דורש מידע מספיק ומהימן, ומדגם שהמבוקר בחר אינו מהימן, כי הבחירה עצמה היא מידע שאבד. התהליך הנכון: לבקש את האוכלוסייה המלאה ממערכת, לא מאדם; לאמת שלמות (ספירה, סכום, טווח תאריכים מול מקור בלתי תלוי); לסווג לפי סיכון; לבחור בעצמכם, אקראית או מבוססת סיכון, ולתעד את השיטה, הגודל והבחירה בנייר העבודה לפני שנוגעים בתיק הראשון. בביקורת ציות המדגם נוטה אל השכבה בסיכון גבוה, כי שם הרגולטור מסתכל. כשהזמן קצר מקטינים את המדגם ומסבירים את המגבלה; לא מוותרים על העצמאות. מדגם שהלקוח בחר הוא מצגת, ואת זה הרגולטור יודע לזהות מהר יותר מכם."},{"id":"attribute-sampling","title":"דגימת תכונות ושיעורי חריגה","tier":1,"frameworks":["gias-2024","isox","external-auditor-reliance"],"skills":["testing","judgment"],"body":"דגימת תכונות עונה על שאלה אחת: באיזה שיעור הבקרה לא בוצעה כנדרש. ארבעה פרמטרים קובעים את גודל המדגם: שיעור חריגה נסבל (כמה כשל ההנהלה מוכנה לסבול בבקרת מפתח, לרוב 5% עד 10%), שיעור חריגה צפוי, רמת ביטחון (90% או 95%), וגודל האוכלוסייה, שמשפיע רק כשהיא קטנה. מהתוצאה מחשבים גבול עליון: עם 25 פריטים וחריגה אחת, הגבול העליון לשיעור החריגה באוכלוסייה הוא כ-15% ברמת ביטחון 90%; ללא חריגות כ-9%; ובביטחון 95% עם חריגה אחת כ-18%. אם הגבול העליון עולה על השיעור הנסבל, המדגם אינו תומך בהסתמכות, ולא עוזר להגיד «רק אחת». תדירות הבקרה מכתיבה גדלים מקובלים: בקרה שנתית נבדקת באירוע אחד, רבעונית בשניים, חודשית בשניים עד חמישה, יומית בעשרים עד ארבעים. גודל מדגם הוא טיעון כתוב, לא מספר שזוכרים."},{"id":"evidence-sufficiency","title":"ראיות: מספיקות, מהימנות, רלוונטיות","tier":1,"frameworks":["gias-2024","pcbb-307"],"skills":["evidence","interview","writing"],"body":"GIAS 2024 דורש שמסקנה תישען על מידע רלוונטי, מהימן ומספיק. רלוונטי: קשור ישירות לקריטריון ולמצב שאתם טוענים. מהימן: ככל שהמקור בלתי תלוי יותר, כך הראיה חזקה יותר; מסמך ממערכת חזק מצילום מסך ששלח המבוקר, אישור מצד שלישי חזק מהצהרה, ותצפית שלכם חזקה מסיפור. מספיק: כמות שמאפשרת לאדם סביר להגיע לאותה מסקנה. ריאיון הוא נקודת פתיחה ולא ראיה: מה שאמר לכם בעל התהליך מחייב אימות במסמך או בשחזור. נייר העבודה צריך לאפשר שחזור על ידי מי שלא היה בחדר: מקור, תאריך, מי מסר, מה נבדק, מה נמצא. שלושה סימני אזהרה: ראיה שהגיעה מהר מדי ומסודרת מדי; מסמך בלי תאריך ובלי חתימה; ו«זה ידוע לכולם». כשחסרה ראיה, כותבים מגבלת היקף במקום לנחש."},{"id":"finding-anatomy","title":"אנטומיה של ממצא: מצב · קריטריון · סיבה · השפעה · המלצה","tier":1,"frameworks":["gias-2024","internal-audit-law-1992"],"skills":["writing","evidence"],"body":"ממצא טוב הוא חמישה משפטים שכל אחד עונה על שאלה אחרת, ותקן 14.2 של GIAS 2024 בנוי בדיוק כך. מצב: מה נמצא בפועל, בעובדות ובמספרים («ב-3 מתוך 25 תשלומים לא נמצא אישור של מורשה חתימה שני»). קריטריון: מה היה צריך להיות, עם מקור מדויק (סעיף בנוהל, חוזר מנכ\"ל, הוראה). סיבה: למה הפער קיים, ברמת התהליך ולא ברמת האדם (אין בקרה במערכת, נוהל לא עודכן, עומס). השפעה: מה הסיכון או הנזק, בשפה שההנהלה מבינה, עם הערכת היקף. המלצה: פעולה ספציפית, עם בעלים ולוח זמנים, שמטפלת בסיבה ולא במצב. הטעות הנפוצה היא ערבוב: לכתוב את ההשפעה במקום המצב, או המלצה שמתארת את הקריטריון. דירוג הממצא נגזר מההשפעה ומהסבירות, לא מהטון של הפגישה. ממצא שאין לו קריטריון כתוב הוא דעה."},{"id":"segregation-of-duties","title":"הפרדת תפקידים ובקרות מפצות","tier":1,"frameworks":["coso-2013","municipalities-ordinance-170","interior-dg-circulars"],"skills":["controls","client","judgment"],"body":"הפרדת תפקידים מפרידה בין ארבע פונקציות שאסור שיהיו בידי אדם אחד על אותה עסקה: אישור, ביצוע או משמורת על נכסים, רישום, והתאמה או בקרה. כשאדם אחד פותח ספק, מאשר תשלום ומבצע אותו, אין מי שיעצור טעות או תרמית, ו-COSO 2013 מונה את זה תחת פעולות בקרה. «אנחנו מועצה קטנה» היא טענה אמיתית ולא תירוץ: ברשויות קטנות אין מספיק עובדים להפרדה מלאה. התשובה המקצועית היא בקרות מפצות: סקירה תקופתית של מנהל שאינו מעורב, התאמות בנקים על ידי גורם אחר, דוחות חריגים ממערכת, הגבלות הרשאה, וחתימה כפולה מעל סף. הממצא לא נעלם בגלל הגודל; הוא משנה צורה: במקום «אין הפרדה» כותבים «אין הפרדה ואין בקרה מפצה מתועדת». בעולם המוניציפלי הקריטריון הוא תקנות העיריות וחוזרי משרד הפנים, והגזבר הוא הבעלים של הבקרה, לא של הביקורת."},{"id":"management-response","title":"תגובת הנהלה: לקבל, לדחות, לתקן","tier":2,"frameworks":["gias-2024","internal-audit-law-1992","pcbb-307"],"skills":["client","writing","escalation"],"body":"לכל ממצא מצורפת תגובת הנהלה, והיא חלק מהדוח, לא נספח. תגובה טובה אומרת שלושה דברים: האם ההנהלה מקבלת את הממצא, מה תעשה (פעולה ספציפית שמטפלת בסיבה), מי אחראי ועד מתי. כמבקרים, אתם בודקים את התגובה כמו ראיה: תגובה ש«מקבלת» את הממצא אבל מציעה פעולה שלא נוגעת בסיבה היא תגובה לתיקון; תגובה שדוחה את הממצא מחייבת אתכם לבדוק מחדש את הקריטריון והראיה, ואם הם עומדים, להשאיר את הממצא ולציין את המחלוקת. GIAS 2024 (תקן 15.1) וחוק הביקורת הפנימית מכירים במצב שבו ההנהלה מחליטה לקבל סיכון במקום לתקן: אז הנושא עולה לדירקטוריון או לוועדת הביקורת, לא נעלם. תקן 15.2 דורש לאמת את היישום בהמשך. מעקב אחרי ממצאים הוא ביקורת בפני עצמה, ו«בטיפול» שלוש שנים ברציפות הוא ממצא חדש על ההנהלה."},{"id":"procedure-writing","title":"כתיבת נוהל שמישהו יבצע","tier":1,"frameworks":["coso-2013","three-lines","gias-2024"],"skills":["writing","controls","client"],"body":"נוהל הוא מסמך קו שני: הוא מתאר איך הקו הראשון מבצע תהליך ואיזה בקרות משובצות בו. שישה חלקים קבועים: מטרה (למה הנוהל קיים, במשפט); תחולה (על מי ועל מה הוא חל, ועל מה לא); אחריות (בעל התהליך בשם תפקיד, לא בשם אדם); שלבי התהליך (בסדר כרונולוגי, מי עושה מה, עם איזה מסמך או מערכת); בקרות (מי בודק, מתי, מה קורה בחריגה, ואיזו ראיה נשארת); ומחזור עדכון ואישור (מי מאשר, מתי בודקים מחדש, מי מפיץ). שלוש מלכודות: זחילת היקף, כשהנוהל מנסה לכסות גם את מה שלא ביקשו; נוהל ללא בעלים, שאף אחד לא יעדכן; ובקרות על הנייר, שנשמעות טוב ואין מי שמבצע אותן, ואז הביקורת הבאה תמצא פער בין הנוהל למציאות. בדיקה אחרונה לפני אישור: לתת את הטיוטה למי שמבצע ולשאול מה לא ברור."},{"id":"premortem","title":"פרה-מורטם","tier":1,"frameworks":["decision-process"],"skills":["premortem","judgment"],"body":"פרה-מורטם, שטבע גארי קליין, הופך את השאלה: במקום «מה יכול להשתבש?» מניחים שההחלטה כבר נכשלה ושואלים «מה הסיבה הסבירה ביותר?». הדמיון של כישלון שכבר קרה משחרר אנשים מהנימוס ומהאופטימיות של תחילת הדרך, והמחקר מראה שהוא מעלה את מספר הסיבות שמזהים. בחדר ההחלטה אתם בוחרים מצב כישלון אחד מתוך כמה, והבחירה הזו מולידה שני דברים: סימן אזהרה מוקדם («מה יוכיח שטעיתי»), שנכנס לממו, ומועד לבדוק אותו. הרעיון הוא כיול: אחרי כמה שבועות הרישום יראה אם הכישלון שניבאתם הוא זה שקרה. פרה-מורטם שלא מתאים לחלופה שבחרתם הוא סימן שלא חשבתם עד הסוף; כישלון שהתממש ושלא ניבאתם הוא נקודת למידה. הכלל: לכל החלטה לא הפיכה, שאלה אחת על הדרך שבה היא נשברת."},{"id":"base-rates","title":"שיעורי בסיס והמבט מבחוץ","tier":1,"frameworks":["decision-process","risk-survey-method"],"skills":["judgment","risk","testing"],"body":"המבט מבפנים רואה את המקרה שלפניכם: הלקוח הזה, התיק הזה, האנשים האלה. המבט מבחוץ שואל מה קורה בדרך כלל במקרים כאלה, וזה שיעור הבסיס. כהנמן וטברסקי הראו שאנשים מתעלמים ממנו כשיש להם סיפור, ולכן במשחק כל חדר החלטה ברמת מתחיל מציג כרטיס שיעור בסיס ממקור כתוב: כמה חריגות מצפים במדגם, כמה אירועי הפסד יש בתהליך כזה, באיזה שיעור תיקון ליקוי נדחה. השימוש הנכון: מתחילים מהשיעור הכללי ומזיזים אותו לפי ראיות ספציפיות, לא להפך. «הגזבר נראה לי אמין» הוא ראיה חלשה מול «ב-40% מהרשויות הקטנות אין בקרה מפצה». גם במפת חום: סבירות שמדורגת «נמוכה» בתהליך עם היסטוריה של אירועים היא בעיה של שיעור בסיס, לא של אופטימיות. השאלה שמחזירה אתכם למבט מבחוץ: «בכמה מקרים כאלה זה נגמר טוב?»"},{"id":"reversibility","title":"הפיכות: דלת חד-כיוונית או דו-כיוונית","tier":1,"frameworks":["decision-process"],"skills":["premortem","judgment","prio"],"body":"לא כל ההחלטות שוות. החלטה הפיכה היא דלת דו-כיוונית: אם טעיתם, חוזרים בעלות נמוכה. החלטה בלתי הפיכה היא דלת חד-כיוונית: מייל ששלחתם ללקוח, דירוג שהורדתם בדוח שנחתם, מדגם שסגרתם, הודעה שהגיעה לנושא בדיקה. ההבחנה הזו קובעת כמה מידע צריך לפני ההחלטה: על דלת דו-כיוונית פועלים מהר ומתקנים; על דלת חד-כיוונית אוספים עוד, מתייעצים, ומעדיפים את החלופה ההפיכה אם איכותה דומה. במשחק הרובריקה מענישה בדיוק מקרה אחד: בחרתם חלופה בלתי הפיכה כשהייתה חלופה הפיכה באותה איכות או טובה ממנה. בפועל זה קורה בעיקר תחת לחץ ובאנרגיה נמוכה, כשהרצון לסגור משהו גובר על הרצון לסגור אותו נכון. הכלל: הפיך, פעל; בלתי הפיך, הסלם או דחה בשבוע."},{"id":"escalation-calibration","title":"כיול הסלמה: מתי מעלים ומתי מעדכנים","tier":1,"frameworks":["decision-process","gias-2024"],"skills":["escalation","client"],"body":"הסלמה היא כלי, ויש לה שלוש דרגות: לא להעלות, לעדכן (להודיע למנהל ההתקשרות מה החלטתם ולמה, בלי לבקש אישור), ולהסלים (להעביר את ההחלטה למי שיש לו סמכות או מידע שאין לכם). מסלימים כשחסר אחד משניים: מידע שלא תוכלו להשיג, או סמכות, למשל סירוב לקוח, חשד לתרמית, ניגוד עניינים, או משהו שמחייב דיווח לרגולטור. לא מסלימים כשחסר רק אומץ. שתי טעויות סימטריות: הסלמה מוקדמת, «זאב-זאב», שמכלה את תשומת הלב של המנהל ומלמדת אותו שאתם לא מחליטים; והסלמה מאוחרת, כשהנזק כבר נעשה והמנהל שומע עליו מהלקוח. הכלל של המנהלים הטובים: אם כבר מעלים, מגיעים עם הצעה, «אני מתכנן ככה, מתנגד?», לא עם שאלה פתוחה. היומן מודד את הכיול שלכם לאורך זמן: ימין, מוקדם, מאוחר."},{"id":"decision-memo","title":"ממו החלטה ומעקב","tier":1,"frameworks":["decision-process"],"skills":["memo","writing"],"body":"ממו החלטה הוא ארבע שורות שכותבים לפני שיודעים את התוצאה, כדי שלא תוכלו לשכתב את העבר. מה החלטתי: החלופה, במשפט. למה: הנימוק המרכזי, זה שיתברר כנכון או כשגוי, לא רשימת כל השיקולים. מה יוכיח שטעיתי: סימן קונקרטי וניתן לצפייה, שיוצא מהפרה-מורטם («ראיות מגיעות באיחור של יותר משבוע», «אפס לקוחות בסיכון גבוה במדגם»). מתי בודקים שוב: תאריך, לא «בהמשך». המועד נגזר מקצב ההשלכות: שבועיים לדברים שנשברים מהר, שמונה שבועות למה שמבשיל לאט, ארבעה כברירת מחדל. ביום המעקב משווים את התשובה שלכם לרישום, וזה כיול, לא מבחן. ממו כזה עובד גם בעבודה האמיתית: אותם ארבעה כותרים במייל לעצמכם, ואחרי עונה יש לכם יומן שמראה מתי הנימוקים שלכם מחזיקים ומתי התוצאה הייתה רק מזל."},{"id":"framing","title":"מסגור: השאלה שבאמת עומדת כאן","tier":1,"frameworks":["decision-process"],"skills":["framing","judgment"],"body":"רוב ההחלטות הרעות מתחילות משאלה לא נכונה. המסגור הוא בחירת השאלה: «האם אספיק בזמן?» מוביל לקיצור דרך; «האם 15 התיקים האלה מייצגים את האוכלוסייה?» מוביל למתודולוגיה. ארבעה מסגורים נפוצים ושגויים: הצר מדי, שמתמקד בלוח הזמנים או בנוחות; הפוליטי, שמתמקד במי ייפגע; מסגור של «אין כאן שאלה», שמקבל את מה שהגיע כנתון; והרחב מדי, שהופך בעיה של מדגם לשאלה על אופי הלקוח. מסגור טוב מתחיל מהיעד של העבודה (ראיה שעומדת מול רגולטור, סיכון שמדורג נכון, נוהל שמבוצע) ושואל מה חוסם אותו. לפעמים שני מסגורים נכונים באותה מידה, ולכן זו לא שאלת טריוויה; מה שנמדד הוא אם המסגור שבחרתם מכסה את הסיכון. תרגיל מהיר: לנסח את השאלה במשפט שמתחיל ב«האם», ולבדוק אם התשובה «כן» פותרת את הבעיה האמיתית."},{"id":"regulatory-monitoring","title":"ניטור רגולטורי: איום שרואים מוקדם הוא פרויקט","tier":1,"frameworks":["pcbb-308","cma-circulars","interior-dg-circulars","privacy-amendment-13"],"skills":["reg","prio","gather"],"body":"הרגולציה בישראל זזה בחוזרים, לא בחוקים: הפיקוח על הבנקים מעדכן הוראות ניהול בנקאי תקין, רשות שוק ההון מפרסמת חוזרים לגופים מוסדיים, משרד הפנים מוציא חוזרי מנכ\"ל, והרשות להגנת הפרטיות מפרסמת הנחיות ליישום תיקון 13. הוראה 308 מטילה על קצין הציות לנטר שינויים ולהעריך את השפעתם, אבל לפירמה מייעצת זה גם מודל עסקי: לקוח שמקבל מכם את תמצית החוזר שבוע אחרי פרסומו, עם «מה זה אומר לכם ועד מתי», רואה בכם שותף ולא ספק. השיטה פשוטה ומשעממת: רשימת מקורות קבועה, סריקה שבועית של שעה, רישום של כל פרסום עם תאריך תחולה, ומיפוי ללקוחות ולתהליכים שלהם. ההבדל בין תקרית לפרויקט הוא כמעט תמיד הזמן שהיה לכם: חוזר שראיתם חודשיים לפני התחולה הוא תוכנית עבודה; אותו חוזר שהלקוח שמע עליו מהרגולטור הוא ממצא."},{"id":"scope-management","title":"ניהול היקף: מה בפנים, מה בחוץ, ומי החליט","tier":1,"frameworks":["gias-2024","pcbb-307","isox"],"skills":["prio","client","writing"],"body":"היקף ההתקשרות הוא ההסכמה הכתובה על מה בודקים, לאיזו תקופה, באילו יחידות ובאיזו עומק, ו-GIAS 2024 (תקן 13) דורש לתעד אותו בתכנון ההתקשרות ולאשר אותו מול בעלי העניין. שני כשלים הפוכים מאיימים עליו. זחילת היקף: הלקוח מבקש «רק עוד תהליך קטן», המנהל מוסיף יחידה, ובסוף יש אותן שעות לפי שניים יותר עבודה, והאיכות משלמת. צמצום היקף תחת לחץ: הגזבר מציע לוותר על הרכש «כי יש מכרז בעיצומו», ואם הוויתור לא נכתב כמגבלת היקף בדוח, הביקורת הבאה תשאל למה לא בדקתם בדיוק את זה. הכלל: כל שינוי היקף הוא החלטה מתועדת עם שלושה חלקים, מה השתנה, מי אישר, ומה ההשלכה על המסקנה. ב-ISOX ההיקף נגזר ממהותיות ומסיכון, ולכן הוא טיעון; בביקורת פנימית הוא נגזר מתוכנית העבודה שוועדת הביקורת אישרה, ולכן שינוי שלו עובר דרכה."},{"id":"sponsor-and-promotion","title":"ספונסר, קידום ומה באמת נמדד","tier":1,"frameworks":["decision-process"],"skills":["client","memo","present"],"body":"קידום בפירמת ייעוץ לא נקבע בטבלת ציונים אלא בחדר שבו מישהו צריך לטעון בשבילכם. הספונסר הוא שותף או מנהל שסומך עליכם מספיק כדי לשים את שמו ליד שלכם, ואמון כזה נבנה משלושה דברים שאפשר לתכנן: עבודה שעומדת מול הלקוח והרגולטור בלי שהוא צריך לתקן אותה, עדכונים קצרים בזמן הנכון (לא הסלמה על כל דבר, לא הפתעה בסוף), והיכולת להסביר החלטה במשפט אחד עם נימוק. במשחק הספונסר הוא תנאי קידום לצד ציון העונה, אמון הפירמה וההגשה, והמנטור שעוזב לוקח את החסות איתו. בעבודה האמיתית זה נראה כך: בסוף כל תיק, שורה למנהל עם מה נעשה, מה נמצא, ומה הייתם עושים אחרת. יומן ההחלטות הוא התיק שלכם לשיחת הקידום, כי הוא מראה תהליך ולא רק תוצאות, ותוצאות לבדן הן לפעמים מזל."},{"id":"energy-and-judgment","title":"אנרגיה ושיקול דעת","tier":1,"frameworks":["decision-process"],"skills":["prio","judgment","premortem"],"body":"עייפות לא מורידה את הידע; היא מורידה את הנכונות להשתמש בו. המחקר על קבלת החלטות תחת עומס מראה שככל שהמשאבים הקוגניטיביים יורדים, אנשים נוטים לברירת המחדל, לחלופה הראשונה שעל השולחן, ולדחיית בירורים שעולים זמן. במשחק זה מודל מפורש: מתחת ל-30 אנרגיה עלות המידע מוכפלת ומופיעה חלופת «קיצור דרך» מפתה, בדיוק כמו בשבוע הרביעי של עונת הדוחות. שלושה כללים מעשיים. הראשון: החלטות בלתי הפיכות (שליחת דוח, הורדת דירוג, סגירת מדגם) לא מקבלים בסוף יום ארוך; דוחים לבוקר. השני: מנוחה היא פעולה בתקציב, לא מה שנשאר ממנו; בלוק מנוחה כל שבוע שלישי בעונת לחץ שומר על הציון. השלישי: כשאתם מזהים שאתם מחפשים סיבה לא לבקש את האוכלוסייה המלאה, זה הרגע לבקש אותה. העייפות היא מידע על המצב שלכם, לא על התיק."}]},"matchTypes":[{"id":"validation","hebrew":"תיקוף ממצאים מול הלקוח","hebrewByEngType":{"policy-writing":"סבב הערות עם בעל התהליך"},"moments":3,"trigger":"end of findings phase","fit":{"basis":{"risk":3,"rules":1},"transparency":{"full":3,"managed":1},"escalation":{"low":1,"high":2}}},{"id":"present","hebrew":"הצגה לדרג בכיר","hebrewByEngType":{"policy-writing":"אישור הנוהל בהנהלה"},"moments":3,"trigger":"end of present phase","fit":{"basis":{"risk":3,"rules":1},"transparency":{"full":2,"managed":2},"escalation":{"low":1,"high":3}}},{"id":"inspection","hebrew":"ביקורת רגולטור","hebrewByEngType":{},"moments":5,"trigger":"1-2 per season at financial clients, announced 3 weeks ahead (6 with scouting)","fit":{"basis":{"risk":1,"rules":3},"transparency":{"full":3,"managed":0},"escalation":{"low":0,"high":3}}},{"id":"incident","hebrew":"תקרית","hebrewByEngType":{},"moments":3,"trigger":"2 per season, any non-holiday week, scaled by firm.incidentRate","fit":{"basis":{"risk":3,"rules":1},"transparency":{"full":3,"managed":1},"escalation":{"low":0,"high":3}}},{"id":"ac","hebrew":"ועדת ביקורת","hebrewByEngType":{},"moments":5,"trigger":"quarter close (weeks 12, 24, 36, 48) for the active financial-sector engagement with the earliest deadline, else any active engagement, else skipped","momentsFrom":["present","inspection"],"fit":{"basis":{"risk":3,"rules":2},"transparency":{"full":2,"managed":2},"escalation":{"low":2,"high":2}}}],"moments":[{"id":"val-criterion-dispute-v1","family":"criterion-dispute","bank":"moment","journal":"light","matchType":["validation"],"ti function itemInfo(st, item) {
  const type = item.type || 'news'; const ctx = ctxFor(st, item.engId); let subject = ''; let senderId = item.sender || null; let danger = false;
  const sc = item.scenarioId ? CT.scenario(item.scenarioId) : null;
  if (item.key && hasKey(item.key) && type === 'news') subject = tp(item.key, item.params || {}, ctx);
  else if (type === 'decision') subject = sc ? txp(sc.title, ctx) : (item.scenarioId || '');
  else if (type === 'moment') { const m = S.match(st, item.matchId); const e = m && S.eng(st, m.engId); subject = CT.matchTypeLabel(m ? m.type : item.matchType, e && e.type) + (e ? ' · ' + ((CT.client(e.clientId) || {}).name || '') : ''); }
  else if (type === 'consequence') { const e = S.entry(st, item.journalId); subject = item.text ? txp(item.text, ctx) : item.key && hasKey(item.key) ? tp(item.key, item.params || {}, ctx) : tp('consequence.landed', { week: e ? e.week : '', title: e ? txp(e.title, ctx) : '' }, ctx); danger = true; }
  else if (type === 'followup') { const e = S.entry(st, item.journalId); subject = tp('followup.title') + (e ? ' · ' + txp(e.title, ctx) : ''); }
  else if (type === 'offer') { const f = CT.firm(item.firmId); subject = tp('offers.role', { title: tp('tier.' + S.tier(st) + '.title'), firm: f ? f.name : item.firmId || '' }); }
  else subject = sc ? txp(sc.title, ctx) : item.title ? txp(item.title, ctx) : tp('inbox.type.' + type);
  if (sc && sc.sender && !senderId) senderId = sc.sender;
  if (!senderId && (type === 'decision' || type === 'moment')) { const e = S.eng(st, item.engId); senderId = e ? (e.contactId || e.managerId) : null; }
  if (senderId && !CT.person(senderId)) { const byRole = CT.personByRole(senderId); if (byRole) senderId = byRole.id; else if (senderId !== 'system') senderId = (ctx.params && ctx.params[senderId]) ? senderId : 'system'; }
  const name = senderId && senderId !== 'system' ? personName(senderId, ctx) : tp('inbox.system');
  subject = subject.length > 110 ? subject.slice(0, 108) + '…' : subject;
  return { type, subject, name, danger, repeat: !!(item.repeat || item.variantOf), card: !!item.card, scouted: !!item.scouted };
}

  'import': () => { const ta = root.querySelector('[data-role="import-json"]'); const text = ta ? ta.value.trim() : ''; if (!text) return; let st = null, notes = []; if (has('importJSON')) { const r = call('importJSON', text); if (!okRes(r) || !r.state) { errToast(r); return; } st = r.state; notes = r.notes || []; } else { try { st = JSON.parse(text); } catch (e) { toast('toast.importFailed'); return; } } if (!st || !st.player) { toast('toast.importFailed'); return; } state = st; ui.ctxCache = null; showMessages(notes); toast('toast.imported'); autosave(); go('dash'); },
  'reset': () => confirmBox(t('settings.reset.confirm'), () => { storage.removeItem(SLOT_KEY(ui.slot)); state = null; ui.sheet = null; toast('toast.reset'); go('open'); }, true),
  'to-open': () => { autosave(); state = null; ui.sheet = null; go('open'); },
};
function onEvent(ev) {
  const el = ev.target.closest('[data-act]'); if (!el || !root.contains(el)) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  const isField = el.matches('input, textarea, select');
  if (ev.type === 'click' && isField) return;
  if (ev.type !== 'click' && !isField) return;
  if (ev.type === 'input' && !el.matches('input[type="text"], textarea')) return;
  if (ev.type === 'change' && el.matches('input[type="text"], textarea')) return;
  try { fn(el, ev); } catch (e) { console.warn('action failed', el.dataset.act, e); toast('ui.engineError'); }
}
root.addEventListener('click', onEvent); root.addEventListener('input', onEvent); root.addEventListener('change', onEvent);
root.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && ui.sheet) { let c; try { c = sheetContent(ui.sheet); } catch (e) { c = {}; } if (!c.noClose) closeSheet(); } });

/* ───────────────────────── 10. BOOT ───────────────────────── */
function snapshot() { return { state, ui: { screen: ui.screen, slot: ui.slot, filters: ui.filters } }; }
function start(data) {
  CT.load(); applyTheme(storage.getItem('mm.theme') || 'auto'); applySize(storage.getItem('mm.size') || 'md');
  if (data && data.state && data.state.player) { state = data.state; Object.assign(ui, data.ui || {}); ui.sheet = null; if (ui.screen === 'open') ui.screen = 'dash'; }
  else { const slot = Number(storage.getItem('mm.slot')) || 0; const st = slot ? loadSlot(slot) : null; if (st) { state = st; ui.slot = slot; ui.screen = 'dash'; } else ui.screen = 'open'; }
  render();
}
window.MM_UI = { snapshot, render, go, t, get state() { return state; }, set state(s) { state = s; ui.ctxCache = null; render(); } };
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.onSnapshot === 'function') { try { hot.onSnapshot(snapshot); } catch (e) { /* noop */ } }
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
